<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欣莘醫美集團內部教育訓練</title>
<style>
  :root{
    --sidebar:#4a423d;
    --sidebar-active:#5a5049;
    --bg:#f3ede6;
    --card:#fffdfb;
    --accent:#b98d7c;
    --accent-soft:#ede1da;
    --text:#3d3733;
    --sub:#948a80;
    --border:#e6ddd2;
    --ok:#8b9a83;
    --warn:#c6a26a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  /* Sidebar */
  .sidebar{width:230px;background:var(--sidebar);color:#e3dcd4;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .brand .name{font-weight:800;font-size:16px;color:#fff;letter-spacing:0.5px;}
  .brand .sub{font-size:10px;letter-spacing:2px;color:#a89b8f;}
  .nav-label{font-size:11px;color:#8f8177;padding:14px 10px 6px;letter-spacing:1px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#d8cfc5;margin-bottom:2px;}
  .nav-item:hover{background:#5a5049;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item .ico{width:18px;text-align:center;}
  .user-box{margin-top:auto;padding:12px;border-top:1px solid #5a5049;}
  .user-box select{width:100%;background:#5a5049;color:#fff;border:1px solid #6b6058;border-radius:8px;padding:8px;font-size:13px;}
  .user-box label{font-size:11px;color:#a89b8f;display:block;margin-bottom:6px;}

  /* Main */
  .main{flex:1;padding:28px 34px;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .topbar h1{font-size:26px;margin:0;}
  .topbar .date{font-size:12px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;}
  .btn{background:var(--sidebar);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{background:#213631;}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:#a67a67;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:6px 10px;font-size:12px;}

  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-card .label{color:var(--sub);font-size:13px;}
  .stat-card .value{font-size:30px;font-weight:800;margin-top:8px;}
  .stat-card .icon{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;}

  .section-title{font-size:16px;font-weight:700;margin:26px 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--sub);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;}
  td{padding:12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:#e6ebe2;color:var(--ok);}
  .pill.warn{background:#f5ecdd;color:var(--warn);}
  .pill.off{background:#efe9e2;color:var(--sub);}

  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  input[type=text],input[type=number],input[type=email],textarea,select.field{
    padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;flex:1;min-width:140px;
  }
  textarea{width:100%;min-height:60px;}
  .quiz-q{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfaf7;}
  .quiz-q .opt-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .course-list{display:flex;flex-direction:column;gap:10px;}
  .course-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;}
  .course-item:hover{border-color:var(--accent);}
  .course-item.selected{border-color:var(--accent);background:var(--accent-soft);}
  .course-item h4{margin:0 0 4px;font-size:14px;}
  .course-item p{margin:0;font-size:12px;color:var(--sub);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .name{width:100px;font-size:12px;color:var(--sub);flex-shrink:0;}
  .bar-track{flex:1;height:10px;background:#efece3;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
  .bar-row .pct{width:40px;text-align:right;font-size:12px;font-weight:700;}
  .empty{color:var(--sub);font-size:13px;padding:20px;text-align:center;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  .muted{color:var(--sub);font-size:12px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:13px;}
  .icon-btn:hover{color:var(--accent);}
  .result-banner{padding:14px;border-radius:10px;margin-bottom:14px;font-size:14px;font-weight:700;}
  .result-banner.pass{background:#e6ebe2;color:var(--ok);}
  .result-banner.fail{background:#f3e4de;color:#b06a54;}
  @media(max-width:900px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;}
    .grid4{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
  }
  .login-gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:50;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:320px;text-align:center;box-shadow:0 12px 32px rgba(60,50,40,0.10);}
  .login-logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .login-card h2{margin:0 0 2px;font-size:18px;}
  .login-label{display:block;text-align:left;font-size:12px;color:var(--sub);margin-bottom:6px;margin-top:14px;}
  .login-error{color:#b06a54;font-size:12px;text-align:left;margin-top:10px;}
</style>
</head>
<body>
<div id="loginGate" class="login-gate"></div>
<div class="app" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="logo">欣</div>
      <div>
        <div class="name">欣莘醫美集團</div>
        <div class="sub">INTERNAL TRAINING</div>
      </div>
    </div>
    <div class="nav-label">工作空間</div>
    <div class="nav-item active" data-view="dashboard" data-admin-only="1"><span class="ico">◆</span>營運總覽</div>

    </div>
  </div>

  <div class="main" id="main"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>

/* ---------- Storage helpers ---------- */
function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v!==null? JSON.parse(v): fallback; }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('儲存失敗', e); }
}

/* Shared backend: Google Apps Script + Google Sheet */
const API_URL = 'https://script.google.com/macros/s/AKfycbzECIWlnmrXBzrZUNwLVyxF7geQMGJK-QddoeWCzd5WtEDMdixD3sKhKKKYT2owa5LJcQ/exec';
let __jsonpCounter = 0;
function jsonpRequest(params, ms){
  return new Promise((resolve, reject)=>{
    const cbName = 'lms_cb_' + (__jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ window[cbName] = function(){}; script.remove(); reject(new Error('timeout')); }, ms || 10000);
    function cleanup(){ clearTimeout(timeout); delete window[cbName]; script.remove(); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script.src = API_URL + '?' + qs;
    script.onerror = ()=>{ cleanup(); reject(new Error('script load error')); };
    document.body.appendChild(script);
  });
}
async function jsonpRequestWithRetry(params, retries, ms){
  retries = (retries===undefined)? 2 : retries;
  try{
    return await jsonpRequest(params, ms);
  }catch(e){
    if(retries > 0){
      await new Promise(r=>setTimeout(r, 700));
      return jsonpRequestWithRetry(params, retries-1, ms);
    }
    throw e;
  }
}
function xhrPost(url, data){
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    const timer = setTimeout(()=>{ xhr.abort(); reject(new Error('timeout')); }, 20000);
    xhr.onload = ()=>{
      clearTimeout(timer);
      const t = xhr.responseText || '';
      // Apps Script answers {"status":"ok"} on success; an error page (e.g. cell too large) must NOT count as saved.
      if(xhr.status>=200 && xhr.status<300 && (t==='' || /"status"\s*:\s*"ok"/.test(t))) resolve(t);
      else reject(new Error('write-failed'));
    };
    xhr.onerror = ()=>{ clearTimeout(timer); reject(new Error('network error')); };
    xhr.send(JSON.stringify(data));
  });
}
async function xhrPostWithRetry(url, data, retries){
  retries = (retries===undefined)? 1 : retries;
  try{
    return await xhrPost(url, data);
  }catch(e){
    if(retries > 0){
      await new Promise(r=>setTimeout(r, 1000));
      return xhrPostWithRetry(url, data, retries-1);
    }
    throw e;
  }
}
async function apiGet(key){
  const val = await jsonpRequestWithRetry({ key: key });
  return val; // null is a legitimate "key not found" result
}
async function apiSet(key, value){
  // POST body has no practical size limit, unlike a GET query string — safe for large courses/quizzes
  await xhrPostWithRetry(API_URL, { key: key, value: JSON.stringify(value) });
}

async function loadStaff(){ const v = await apiGet('lms-staff'); return v===null? [] : v; }
async function saveStaff(list){ await apiSet('lms-staff', list); }

/* Courses: stored one-per-row (key "lms-course:<id>") so no single cell ever
   approaches Google Sheets' ~50,000-character limit. A small index row keeps the
   display order. Rows are the source of truth; deleted courses are tombstoned
   (deleted:true) rather than removed. */
const COURSE_PREFIX = 'lms-course:';
async function loadCourseIndex(){ const v = await apiGet('lms-course-index'); return Array.isArray(v)? v : []; }
async function saveCourseIndex(ids){ await apiSet('lms-course-index', ids); }
async function loadCourse(id){ return await apiGet(COURSE_PREFIX+id); }
async function saveCourse(course){ await apiSet(COURSE_PREFIX+course.id, course); }

// One request that returns many rows at once (needs the updated Apps Script, which tags its reply with __v:2).
async function apiMulti(keys, prefixes){
  const params = { action:'multi', keys: keys.join(','), prefixes: prefixes.join(',') };
  const v = await jsonpRequestWithRetry(params, 1, 30000);
  if(!v || typeof v!=='object' || Array.isArray(v) || !(v.__v>=2)) throw new Error('multi-unsupported');
  return v;
}

// Run fn over items with at most `limit` requests in flight; any failure rejects.
async function poolMap(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(true){
      const i = next++;
      if(i >= items.length) return;
      results[i] = await fn(items[i]);
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return results;
}

function assembleCourses(bulk){
  const index = Array.isArray(bulk['lms-course-index'])? bulk['lms-course-index'] : [];
  const byId = {};
  const rowOrder = [];
  Object.keys(bulk).forEach(k=>{
    if(k.indexOf(COURSE_PREFIX)!==0) return;
    const v = bulk[k];
    if(!v || typeof v!=='object' || v.deleted) return;
    const id = k.slice(COURSE_PREFIX.length);
    if(!v.id) v.id = id;
    byId[id] = v; rowOrder.push(id);
  });
  const ordered = [];
  index.forEach(id=>{ if(byId[id]){ ordered.push(byId[id]); delete byId[id]; } });
  rowOrder.forEach(id=>{ if(byId[id]) ordered.push(byId[id]); });
  return ordered;
}

// Legacy-shaped bulk save — used only by the one-time migration from the old single-cell format.
async function saveCourses(list){
  for(const c of list){ await saveCourse(c); }
  await saveCourseIndex(list.map(c=>c.id));
}

/* Progress: stored one row per person (key "lms-progress:<staffId>") so nobody's save can overwrite
   anybody else's, and no cell can reach the 50,000-character limit. */
const PROGRESS_PREFIX = 'lms-progress:';
async function loadStaffProgress(staffId){
  const v = await apiGet(PROGRESS_PREFIX+staffId);
  return (v && typeof v==='object' && !Array.isArray(v))? v : {};
}
async function saveStaffProgress(staffId, obj){ await apiSet(PROGRESS_PREFIX+staffId, obj); }

// Quiz attempts are stored compactly (answers + right/wrong), not with full question text.
// A question may be single-answer (q.answer = index) or multi-answer (q.multi = true, q.answers = [indexes]).
function correctSet(q){ return q.multi? (q.answers||[]) : [q.answer]; }
function toArr(v){ return Array.isArray(v)? v : ((v===undefined || v===null)? [] : [v]); }
// Multi-answer questions are right only when exactly the right options are chosen.
function gradeQuestion(q, selected){
  const sel = toArr(selected).slice().sort((a,b)=>a-b);
  const cor = correctSet(q).slice().sort((a,b)=>a-b);
  return sel.length===cor.length && sel.every((v,i)=>v===cor[i]);
}
function quizSig(quiz){
  const s = JSON.stringify((quiz||[]).map(q=> q.multi? [q.q, q.options, ['m'].concat(q.answers||[])] : [q.q, q.options, q.answer]));
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function compactCourseProgress(p){
  const q = Object.assign({}, p);
  let hist = Array.isArray(q.quizHistory)? q.quizHistory.slice() : [];
  if(!hist.length && q.quizDetails){
    hist = [{score:q.quizScore, passed:q.quizPassed, submittedAt:q.quizSubmittedAt, details:q.quizDetails}];
  }
  q.quizHistory = hist.map(h=>{
    if(!h.details) return h;
    const d = h.details;
    return {
      score:h.score, passed:h.passed, submittedAt:h.submittedAt,
      answers: d.map(x=>(x.selected===undefined? null : x.selected)),
      ok: d.map(x=>x.isCorrect? 1:0),
      qsig: quizSig(d.map(x=>({q:x.q, options:x.options, answer:x.correct})))
    };
  });
  delete q.quizDetails;
  if(!q.quizHistory.length) delete q.quizHistory;
  return q;
}
function compactStaffProgress(obj){
  const out = {};
  Object.keys(obj||{}).forEach(k=>{
    const v = obj[k];
    out[k] = (v && typeof v==='object' && !Array.isArray(v))? compactCourseProgress(v) : v;
  });
  return out;
}
// Rebuild question-by-question details for one stored attempt.
function attemptDetails(course, h){
  if(h.details) return h.details; // older full-detail record
  const quiz = (course && course.quiz) || [];
  const sameQuiz = !!(h.qsig && course && quizSig(quiz)===h.qsig);
  return (h.answers||[]).map((sel,i)=>{
    if(sameQuiz && quiz[i]) return {q:quiz[i].q, options:quiz[i].options, selected:sel, correct: quiz[i].multi? quiz[i].answers : quiz[i].answer, isCorrect: gradeQuestion(quiz[i], sel), multi: !!quiz[i].multi};
    return {q:'第 '+(i+1)+' 題(題目後來有修改,僅保留對錯)', options:[], selected:sel, correct:null, isCorrect: !!(h.ok && h.ok[i])};
  });
}

// Per-person progress: use the person's own row if it exists, otherwise start from their record in the
// old single-cell progress (converted in memory). Their own row is created the first time they save anything,
// so there is no big one-time move and nothing is written while the page loads.
function buildProgress(staffList, rows, legacy){
  const out = {};
  staffList.forEach(s=>{
    if(rows[s.id]) out[s.id] = rows[s.id];
    else if(legacy && typeof legacy==='object' && !Array.isArray(legacy) && legacy[s.id]) out[s.id] = compactStaffProgress(legacy[s.id]);
    else out[s.id] = {};
  });
  return out;
}
// A person's latest saved progress for read-modify-write; if they have no row yet, start from what is in memory
// (which already includes their old records) instead of an empty object.
async function fetchOwnProgress(staffId){
  const v = await apiGet(PROGRESS_PREFIX+staffId);
  if(v && typeof v==='object' && !Array.isArray(v)) return v;
  return STATE.progress[staffId]? JSON.parse(JSON.stringify(STATE.progress[staffId])) : {};
}

let __loadStage = '';
async function loadInitialData(){
  let bulk = null;
  __loadStage = '一次讀取全部資料';
  try{
    bulk = await apiMulti(
      ['lms-staff','lms-admin-password','lms-locking-enabled','lms-course-index','lms-progress'],
      [COURSE_PREFIX, PROGRESS_PREFIX]
    );
  }catch(e){
    if(!(e && e.message==='multi-unsupported')) throw e;
  }
  if(bulk){
    const staff = Array.isArray(bulk['lms-staff'])? bulk['lms-staff'] : [];
    let courses = assembleCourses(bulk);
    // very first run only: if the course index has never existed, bring over the oldest single-cell course list
    if(!courses.length && bulk['lms-course-index']===undefined){
      __loadStage = '搬移舊課程資料';
      const legacy = await apiGet('lms-courses');
      if(Array.isArray(legacy) && legacy.length){ await saveCourses(legacy); courses = legacy; }
    }
    const rows = {};
    Object.keys(bulk).forEach(k=>{
      if(k.indexOf(PROGRESS_PREFIX)!==0) return;
      const v = bulk[k];
      if(v && typeof v==='object') rows[k.slice(PROGRESS_PREFIX.length)] = v;
    });
    return {
      staff, courses,
      progress: buildProgress(staff, rows, bulk['lms-progress']),
      adminPassword: (typeof bulk['lms-admin-password']==='string')? bulk['lms-admin-password'] : 'admin123',
      lockingEnabled: (typeof bulk['lms-locking-enabled']==='boolean')? bulk['lms-locking-enabled'] : true
    };
  }
  // Fallback for the older Apps Script (no one-shot read): few requests at a time, and any failure is an error —
  // never silently show a partial list.
  __loadStage = '讀取基本資料(相容模式)';
  const [staff, adminPassword, lockingEnabled, index, legacyProgress] = await Promise.all([
    loadStaff(), loadAdminPassword(), loadLockingEnabled(), loadCourseIndex(), apiGet('lms-progress')
  ]);
  __loadStage = '讀取課程(相容模式)';
  let courses = [];
  if(index.length){
    const rows = await poolMap(index, 3, id=>loadCourse(id));
    courses = rows.filter(v=>v && typeof v==='object' && !v.deleted);
  } else {
    const legacy = await apiGet('lms-courses');
    if(Array.isArray(legacy) && legacy.length){ await saveCourses(legacy); courses = legacy; }
  }
  __loadStage = '讀取個人進度(相容模式)';
  const arr = await poolMap(staff, 3, s=>apiGet(PROGRESS_PREFIX+s.id));
  const rows = {};
  staff.forEach((s,i)=>{ const v = arr[i]; if(v && typeof v==='object' && !Array.isArray(v)) rows[s.id] = v; });
  return { staff, courses, progress: buildProgress(staff, rows, legacyProgress), adminPassword, lockingEnabled };
}

async function loadCurrentUser(){ return storageGet('lms-current-user', null); }
async function saveCurrentUser(id){ storageSet('lms-current-user', id); }
async function loadAdminPassword(){ const v = await apiGet('lms-admin-password'); return v===null? 'admin123' : v; }
async function saveAdminPassword(pw){ await apiSet('lms-admin-password', pw); }
async function loadLockingEnabled(){ const v = await apiGet('lms-locking-enabled'); return v===null? true : v; }
async function saveLockingEnabled(val){ await apiSet('lms-locking-enabled', val); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayLabel(){
  const d=new Date();
  const days=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  return days[d.getDay()]+' · '+d.getDate().toString().padStart(2,'0')+' '+d.toLocaleString('en-US',{month:'short'}).toUpperCase()+' '+d.getFullYear();
}
function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m? m[1]: (url.length===11? url:null);
}

/* ---------- App state ---------- */

function parseDeptParts(raw){
  if(!raw) return [];
  return raw.split(/[\/／]+|[\s\u3000]+/).map(p=>p.trim()).filter(Boolean);
}
function staffDept(s){
  if(s.role==='admin') return '管理部';
  const parts = parseDeptParts(s.dept);
  return parts.length? parts[0] : '未分類';
}
function staffSubCategory(s){
  if(s.role==='admin') return '管理員';
  const parts = parseDeptParts(s.dept);
  if(!parts.length) return '未分類';
  return parts.length>1 ? parts.slice(1).join(' ') : parts[0];
}
// Groups people by department, then by position, so everyone with the same role sits together.
// Departments/positions keep the order they first appeared in; admins come first; within a group the original order is kept.
function sortedStaff(list){
  const src = list || STATE.staff;
  const deptOrder = [];
  const subOrder = {};
  STATE.staff.forEach(s=>{
    const d = staffDept(s), sc = staffSubCategory(s);
    if(!deptOrder.includes(d)) deptOrder.push(d);
    if(!subOrder[d]) subOrder[d] = [];
    if(!subOrder[d].includes(sc)) subOrder[d].push(sc);
  });
  const rank = d => d==='管理部' ? -1 : deptOrder.indexOf(d);
  return src.map((s,i)=>({s,i})).sort((a,b)=>{
    const da = staffDept(a.s), db = staffDept(b.s);
    if(da!==db) return rank(da)-rank(db);
    const sa = (subOrder[da]||[]).indexOf(staffSubCategory(a.s));
    const sb = (subOrder[db]||[]).indexOf(staffSubCategory(b.s));
    if(sa!==sb) return sa-sb;
    return a.i-b.i;
  }).map(x=>x.s);
}

function loginDepartments(){
  const set = new Set(STATE.staff.map(staffDept));
  const arr = Array.from(set);
  arr.sort((a,b)=>{
    if(a==='管理部') return -1;
    if(b==='管理部') return 1;
    return a.localeCompare(b, 'zh-Hant');
  });
  return arr;
}

function updateLoginFieldsVisibility(){

async function attemptLogin(){
  const sel = document.getElementById('loginUserSelect');
  const staffObj = STATE.staff.find(s=>s.id===sel.value);
  const errEl = document.getElementById('loginError');
  if(!staffObj) return;
  const trusted = isDeviceTrusted(staffObj.id);
  if(staffObj.email && !trusted){
    const emailInput = document.getElementById('loginEmailInput');
    const val = emailInput? emailInput.value.trim().toLowerCase() : '';
    if(val !== staffObj.email.trim().toLowerCase()){
      errEl.textContent = 'Email不正確,請重新輸入。';
      errEl.style.display = '';
      return;
    }
    const rememberCheckbox = document.getElementById('loginRememberDevice');
    if(rememberCheckbox && rememberCheckbox.checked){
      setDeviceTrusted(staffObj.id, true);
    }
  }
  const hasAnyAdmin = STATE.staff.some(s=>s.role==='admin');
  if(hasAnyAdmin && staffObj.role==='admin'){
    const pwInput = document.getElementById('loginPasswordInput');
    const pwVal = pwInput? pwInput.value : '';
    const expectedPw = staffObj.password || STATE.adminPassword;
    if(pwVal !== expectedPw){
      errEl.textContent = '管理員密碼不正確。';
      errEl.style.display = '';
      return;
    }
  }
  STATE.currentUserId = staffObj.id;
  await saveCurrentUser(STATE.currentUserId);
  STATE.adminAuthed = (staffObj.role==='admin');
  STATE.quizResult = null;
  STATE.quizAnswers = {};
  recordLastLogin(staffObj.id);
  if(!isAdmin() && ['dashboard','staff','reports'].includes(STATE.view)) STATE.view = 'courses';
  hideLoginGate();
  bindNav();
  renderCurrentUserDisplay();
  updateNavVisibility();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===STATE.view));
  render();
}

function getQuizHistory(staffId, courseId){
  const p = userProgress(staffId)[courseId];
  if(!p) return [];
  if(p.quizHistory && p.quizHistory.length) return p.quizHistory;
  if(p.quizDetails) return [{score:p.quizScore, passed:p.quizPassed, submittedAt:p.quizSubmittedAt, details:p.quizDetails}];
  return [];
}

function renderQuizHistoryModal(staffId, courseId){
  const s = STATE.staff.find(x=>x.id===staffId);
  const course = STATE.courses.find(x=>x.id===courseId);
  if(!s || !course) return;
  const history = getQuizHistory(staffId, courseId);
  const withIdx = history.map((h,i)=>Object.assign({}, h, {__idx:i}));
  withIdx.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  const body = withIdx.length? `<div class="course-list">${withIdx.map((h,rank)=>`
    <div class="course-item" onclick="showQuizAttemptDetail('${staffId}','${courseId}',${h.__idx})">
      <div><h4 style="margin:0;">第${withIdx.length-rank}次測驗</h4><p class="muted" style="margin:2px 0 0;">${fmtTime(h.submittedAt)}</p></div>
      <span class="pill ${h.passed?'ok':'warn'}">${h.score}分</span>
    </div>
  `).join('')}</div>` : '<div class="empty">尚無測驗紀錄</div>';
  showModal(`${escapeHtml(s.name)} — ${escapeHtml(course.title)}<div class="muted" style="font-weight:400;margin-top:4px;">測驗歷史(近一年,共${history.length}次)</div>`, body);
}

function questionReviewHtml(d, i){
  const sel = toArr(d.selected), cor = toArr(d.correct);
  const unanswered = sel.length===0;
  const multi = !!d.multi || Array.isArray(d.correct);
  return `
    <div class="quiz-q" style="border-color:${d.isCorrect?'var(--border)':'#c98f7c'};">
      <div style="font-weight:600;margin-bottom:6px;">${i+1}. ${escapeHtml(d.q)}${multi? ' <span class="pill off" style="margin-left:6px;">複選</span>':''} ${d.isCorrect? '<span class="pill ok" style="margin-left:6px;">答對</span>' : '<span class="pill" style="background:#f3e4de;color:#b06a54;margin-left:6px;">答錯</span>'}</div>
      ${(d.options||[]).map((opt,oi)=>{
        const isCor = cor.includes(oi), isSel = sel.includes(oi);
        let mark = '　', style = 'color:var(--sub);', note = '';
        if(isCor){ mark = '✓'; style = 'color:var(--ok);font-weight:600;'; if(!isSel && multi && !unanswered) note = '(漏選)'; }
        else if(isSel){ mark = '✗'; style = 'color:#b06a54;text-decoration:line-through;'; }
        return `<div style="padding:3px 0;${style}">${mark} ${escapeHtml(opt)}${note? ' <span class="muted">'+note+'</span>':''}</div>`;
      }).join('')}
      ${unanswered? '<div class="muted" style="margin-top:4px;">(未作答)</div>' : ''}
    </div>`;
}

function showQuizAttemptDetail(staffId, courseId, idx){

}

function currentUser(){ return STATE.staff.find(s=>s.id===STATE.currentUserId) || STATE.staff[0]; }
function userProgress(staffId){ return STATE.progress[staffId] || {}; }
function fmtTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
async function recordLastLogin(staffId){

    const mine = STATE.progress[staffId] || {};
    mine._lastLogin = new Date().toISOString();
    STATE.progress[staffId] = mine;

// Drafts: a course with published:false is hidden from everyone except admins and people marked as managers
// (who can preview it). Courses saved before this feature have no flag and count as published.
function isPublished(c){ return !!c && c.published !== false; }
// Which tab a course belongs to. New items remember it (kind), so a half-finished course without a video still stays in its tab.
function courseTab(c){
  if(c && c.kind==='course') return 'course';
  if(c && c.kind==='doc') return 'doc';
  return courseVideos(c).length>0? 'course' : 'doc';
}
function visibleCoursesFor(u, admin){
  if(admin) return STATE.courses;
  const mine = coursesForStaff(u);
  return (u && u.isManager)? mine.concat(STATE.courses.filter(c=>!isPublished(c))) : mine;
}
function coursesForStaff(staffObj){
  if(!staffObj) return STATE.courses.filter(isPublished);
  return STATE.courses.filter(c=>{
    if(!isPublished(c)) return false;
    const hasDeptTargets = c.targetDepts && c.targetDepts.length>0;
    const hasStaffTargets = c.targetStaffIds && c.targetStaffIds.length>0;
    if(!hasDeptTargets && !hasStaffTargets) return true;
    const deptMatch = hasDeptTargets && c.targetDepts.includes(staffObj.dept);
    const staffMatch = hasStaffTargets && c.targetStaffIds.includes(staffObj.id);
    return deptMatch || staffMatch;
  });
}
function staffForCourse(course){
  if(!course) return [];
  const hasDeptTargets = course.targetDepts && course.targetDepts.length>0;
  const hasStaffTargets = course.targetStaffIds && course.targetStaffIds.length>0;
  if(!hasDeptTargets && !hasStaffTargets) return STATE.staff;
  return STATE.staff.filter(s=>{
    const deptMatch = hasDeptTargets && course.targetDepts.includes(s.dept);
    const staffMatch = hasStaffTargets && course.targetStaffIds.includes(s.id);
    return deptMatch || staffMatch;
  });
}

            const p = userProgress(s.id)[course.id];

            else quizStatus = '<span class="pill off">未測驗</span>';

              quizStatus += ` <button class="icon-btn" onclick="showQuizDetailModal('${s.id}','${course.id}')">查看詳情</button>`;
            }
            const complete = isCourseComplete(s.id, course.id);
            return `<tr>
              <td>${escapeHtml(s.name)}</td>
              <td>${escapeHtml(s.dept||'-')}</td>
              <td>${p&&p.watched? '<span class="pill ok">已'+watchedLabel+'</span>':'<span class="pill off">未'+watchedLabel+'</span>'}</td>
              <td class="muted">${fmtTime(p&&p.lastWatchedAt)}</td>
              <td>${quizStatus}</td>
              <td class="muted">${fmtTime(p&&p.quizSubmittedAt)}</td>
              <td><span class="pill ${complete?'ok':'off'}">${complete?'完成':'未完成'}</span></td>
            </tr>`;
          }).join('') || `<tr><td colspan="7" class="empty">目前沒有人被指派這堂課</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
const PREFERRED_CATEGORY_ORDER = ['手術','美療','護理','拍照教學','行政'];
// Category = the explicit "分類" field if set, otherwise the part of the title before "-" (e.g. "手術-天鵝頸" -> 手術).
function courseCategory(c){
  const explicit = ((c && c.category) || '').trim();
  if(explicit) return explicit;
  const m = ((c && c.title) || '').match(/^(.+?)\s*[-–—－−]\s*\S/);
  return m? m[1].trim() : '其他';
}
function groupSortCourses(list){
  const firstSeen = [];
  list.forEach(c=>{ const k = courseCategory(c); if(!firstSeen.includes(k)) firstSeen.push(k); });
  const rank = k => {
    if(k==='其他') return 9999;
    const p = PREFERRED_CATEGORY_ORDER.indexOf(k);
    return p>=0? p : 100 + firstSeen.indexOf(k);
  };
  return list.map((c,i)=>({c,i})).sort((a,b)=>{
    const ka = courseCategory(a.c), kb = courseCategory(b.c);
    if(ka!==kb) return rank(ka)-rank(kb);
    const pa = a.c.pinned? 0:1, pb = b.c.pinned? 0:1;
    if(pa!==pb) return pa-pb;
    return a.i-b.i;
  }).map(x=>x.c);
}
function categoryHeaderHtml(list, idx){
  const cat = courseCategory(list[idx]);
  if(idx>0 && courseCategory(list[idx-1])===cat) return '';
  const n = list.filter(x=>courseCategory(x)===cat).length;
  return `<div style="font-weight:700;font-size:13px;color:var(--accent);margin:${idx? '14px':'0'} 0 2px;">${escapeHtml(cat)} <span class="muted" style="font-weight:400;">(${n})</span></div>`;
}
function sortPinned(list){
  return [...list].sort((a,b)=> (b.pinned?1:0) - (a.pinned?1:0));
}
function courseVideos(c){
  if(!c) return [];
  if(c.videos && c.videos.length) return c.videos;
  if(c.videoUrl) return [{name:c.title||'影片', url:c.videoUrl}];
  return [];
}

function isQuizExempt(staffObj, course){
  if(!staffObj || !course) return false;
  const deptExempt = course.quizExemptDepts && course.quizExemptDepts.includes(staffObj.dept);
  const staffExempt = course.quizExemptStaffIds && course.quizExemptStaffIds.includes(staffObj.id);
  return !!(deptExempt || staffExempt);
}

function isCourseComplete(staffId, courseId){
  const course = STATE.courses.find(c=>c.id===courseId);
  if(!course) return false;
  if(course.referenceOnly) return true;
  const p = userProgress(staffId)[courseId];
  const staffObj = STATE.staff.find(s=>s.id===staffId);
  if(course.quiz && course.quiz.length && !isQuizExempt(staffObj, course)) return !!(p && p.quizPassed);
  return !!(p && p.watched);
}

function coursePrerequisiteIds(course){
  if(!course) return [];
  if(course.prerequisiteIds && course.prerequisiteIds.length) return course.prerequisiteIds;
  if(course.prerequisiteId) return [course.prerequisiteId];
  return [];
}
function isLockExempt(staffObj, course){
  if(!staffObj || !course) return false;
  const deptExempt = course.lockExemptDepts && course.lockExemptDepts.includes(staffObj.dept);
  const staffExempt = course.lockExemptStaffIds && course.lockExemptStaffIds.includes(staffObj.id);
  return !!(deptExempt || staffExempt);
}
function isCourseLocked(staffId, course){
  if(STATE.lockingEnabled===false) return false;
  if(!isPublished(course)) return false;
  const ids = coursePrerequisiteIds(course).filter(id=>{ const pc = STATE.courses.find(x=>x.id===id); return pc && isPublished(pc); });
  if(!ids.length) return false;
  const staffObj = STATE.staff.find(s=>s.id===staffId);
  if(isLockExempt(staffObj, course)) return false;
  return ids.some(id => !isCourseComplete(staffId, id));
}

function courseCompletionPct(staffId, courseId){
  const course = STATE.courses.find(c=>c.id===courseId);
  if(course && course.referenceOnly) return 100;
  const p = userProgress(staffId)[courseId];
  if(!p) return 0;
  const staffObj = STATE.staff.find(s=>s.id===staffId);
  if(course && course.quiz && course.quiz.length && !isQuizExempt(staffObj, course)) return p.quizPassed? 100 : 0;
  return p.watched? 100 : 0;
}

/* ---------- Render router ---------- */
function render(){
  if(!isAdmin() && ['dashboard','staff','reports'].includes(STATE.view)) STATE.view = 'courses';
  const main = document.getElementById('main');
  if(STATE.view==='dashboard') main.innerHTML = renderDashboard();
  else if(STATE.view==='courses') main.innerHTML = renderCourses();
  else if(STATE.view==='documents') main.innerHTML = renderDocuments();
  else if(STATE.view==='quiz') main.innerHTML = renderQuiz();
  else if(STATE.view==='staff') main.innerHTML = renderStaff();
  else if(STATE.view==='reports') main.innerHTML = renderReports();
  afterRender();
}

function listHeaderHtml(title, list, u, admin){
  const total = list.length;
  const required = list.filter(c=>!c.referenceOnly);
  const done = required.filter(c=>isCourseComplete(u.id, c.id)).length;
  const refCount = total - required.length;
  const summary = admin
    ? `共 ${total} 項`
    : `共 ${total} 項 · 需完成 ${required.length} 項,已完成 ${done} 項${refCount? `(另有 ${refCount} 項僅供參考)`:''}`;
  return `<div class="section-title" style="margin-top:0;margin-bottom:4px;">${title}</div><div class="muted" style="margin-bottom:12px;">${summary}</div>`;
}

function quizProblems(quiz){
  const out = [];
  (quiz||[]).forEach((q,n)=>{
    if(!q.q || !String(q.q).trim()) out.push('第 '+(n+1)+' 題還沒有填題目');
    if(!q.options || q.options.length<2 || q.options.some(o=>!String(o).trim())) out.push('第 '+(n+1)+' 題的選項不完整');
    if(!correctSet(q).filter(v=>Number.isInteger(v)).length) out.push('第 '+(n+1)+' 題還沒有設定正確答案');
  });
  return out;
}
// What still has to be fixed before an item may be shown to staff.
function publishProblems(c){
  const out = [];
  if(!c.title || !String(c.title).trim()) out.push('還沒有填名稱');
  if(courseTab(c)==='course' && !c.referenceOnly){
    const vids = courseVideos(c);
    if(!vids.length) out.push('還沒有放任何 YouTube 影片(純文件請改放到「文件資料」,或勾選「僅供參考資料」)');
    vids.forEach((v,i)=>{ if(!ytId(v.url)) out.push('第 '+(i+1)+' 支影片的連結格式不正確'); });
  }
  quizProblems(c.quiz).forEach(m=>out.push('測驗:'+m));
  return out;
}
function audienceText(c){
  const depts = c.targetDepts||[], ids = c.targetStaffIds||[];
  if(!depts.length && !ids.length) return '所有人員(尚未指定適用部門或人員)';
  const parts = [];
  if(depts.length) parts.push(depts.join('、'));
  if(ids.length) parts.push(ids.length+' 位指定人員');
  return parts.join(' + ');
}

function openCourse(id){

async function togglePublish(btn, id){
  const c0 = STATE.courses.find(x=>x.id===id);
  if(!c0) return;
  const willPublish = !isPublished(c0);
  if(willPublish){
    const problems = publishProblems(c0);
    if(problems.length){ alert('還不能發布,請先處理:\n・'+problems.join('\n・')+'\n\n(按「編輯」補齊後再發布)'); return; }
    if(!confirm('發布後,「'+audienceText(c0)+'」就能看到這'+(courseTab(c0)==='course'?'堂課':'份資料')+'。\n\n確定要發布嗎?')) return;
  } else {
    if(!confirm('改回草稿後,同仁會暫時看不到這'+(courseTab(c0)==='course'?'堂課':'份資料')+'(他們已有的觀看與測驗紀錄會保留)。\n\n確定嗎?')) return;
  }
  const restore = lockBtn(btn, '處理中...');
  let c;
  try{ c = await loadCourse(id); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  if(!c || c.deleted){ alert('找不到這筆資料,可能已被其他人刪除,請重新整理頁面。'); restore(); return; }
  c.published = willPublish;
  try{ await saveCourse(c); }
  catch(e){ alert('無法連線到資料庫,尚未儲存,請確認網路連線後再試一次。'); restore(); return; }
  const pi = STATE.courses.findIndex(x=>x.id===id);
  if(pi>=0) STATE.courses[pi] = c;
  alert(willPublish? '✅ 已發布,指定的同仁現在可以看到了。' : '已改回草稿,同仁暫時看不到。');
  render();
}

              ${selected.materials.map(m=>`<div style="margin-bottom:4px;"><a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="btn ghost small" style="text-decoration:none;display:inline-block;">📄 ${escapeHtml(m.name||'講義')}</a></div>`).join('')}
            </div>
          ` : ''}
          <div class="muted" id="watchTimeLabel" style="margin-top:10px;">累計觀看時間:${Math.floor((prog?.watchSeconds||0)/60)} 分 ${Math.floor((prog?.watchSeconds||0)%60)} 秒</div>
          <div class="muted" id="watchSaveStatus" style="margin-top:2px;font-size:12px;"></div>
          ${(selected.quiz && selected.quiz.length && !userExempt && !selected.referenceOnly)? `<button class="btn ghost small" style="margin-top:10px;" onclick="goToQuiz('${selected.id}')">前往測驗 →</button>`:''}
          ${admin? `
          <div style="margin-top:10px;">
            <button class="btn ${isPublished(selected)?'ghost':'accent'} small" onclick="togglePublish(this,'${selected.id}')">${isPublished(selected)?'⏸ 改回草稿':'✅ 發布給同仁'}</button>
            <button class="btn ghost small" onclick="togglePin(this,'${selected.id}')">${selected.pinned?'取消重要標記':'⭐ 設為重要'}</button>
            <button class="btn ghost small" onclick="showEditCourseForm('${selected.id}',true)">編輯課程</button>
            <button class="icon-btn" style="margin-left:10px;" onclick="deleteCourse(this,'${selected.id}')">刪除此課程</button>
          </div>` : ''}
        </div>
      `) : `<div class="card empty">${admin? '尚未選擇課程,請先新增或於右側選擇。' : '目前沒有指派給您的課程。'}</div>`}
    </div>
    <div class="card">
      ${listHeaderHtml('課程清單', visibleCourses, u, admin)}
      <div class="course-list">
        ${visibleCourses.map((c, idx)=>{
          const p = userProgress(u.id)[c.id];
          const complete = isCourseComplete(u.id, c.id);
          const vc = courseVideos(c).length;
          const cLocked = !admin && isPublished(c) && isCourseLocked(u.id, c);
          return categoryHeaderHtml(visibleCourses, idx) + `<div class="course-item ${c.id===STATE.selectedCourseId?'selected':''}" onclick="selectCourse('${c.id}')">
            <div><h4><span style="color:var(--accent);margin-right:6px;">${idx+1}.</span>${cLocked?'🔒 ':''}${c.pinned?'⭐ ':''}${escapeHtml(c.title)}</h4><p>${cLocked? '尚未解鎖' : (p&&p.watched?'已觀看':'未觀看')} ${vc>1? '· '+vc+' 支影片':''} ${c.quiz&&c.quiz.length? '· '+c.quiz.length+' 題測驗':''} ${(admin && !(c.notifyEmails&&c.notifyEmails.trim()))? '· <span style="color:var(--warn);">尚未設定通知主管</span>':''} ${draftBadgeHtml(c)} ${prereqBadgeHtml(c, admin)}</p></div>
            <span class="pill ${cLocked?'off':(complete?'ok':(p?'warn':'off'))}">${cLocked?'鎖定':(complete?'完成':(p?'待測驗':'未開始'))}</span>
          </div>`;
        }).join('') || '<div class="empty">尚無課程</div>'}
      </div>
    </div>
  </div>
  ${((admin || (u && u.canViewRoster)) && selected && isPublished(selected))? courseRosterTableHtml(selected, '觀看') : ''}
  `;
}

/* ---------- Documents ---------- */
function renderDocuments(){
  const admin = isAdmin();
  const allVisible = visibleCoursesFor(currentUser(), admin);
  const visibleDocs = groupSortCourses(allVisible.filter(c=>courseTab(c)==='doc'));
  const selected = visibleDocs.find(c=>c.id===STATE.selectedCourseId) || visibleDocs[0];
  const u = currentUser();
  const prog = selected? userProgress(u.id)[selected.id] : null;
  const userExempt = selected? isQuizExempt(u, selected) : false;
  const locked = (selected && !admin && isPublished(selected))? isCourseLocked(u.id, selected) : false;
  const prereqCourses = selected? coursePrerequisiteIds(selected).map(id=>STATE.courses.find(x=>x.id===id)).filter(Boolean) : [];

  return `
  <div class="topbar">
    <h1>文件資料</h1>
    ${admin? '<button class="btn accent" onclick="showAddCourseForm(false)">+ 新增文件資料</button>' : ''}
  </div>
  <div id="addCourseFormWrap"></div>
  <div class="two-col">
    <div>
      ${selected? (locked? `
        <div class="card empty" style="padding:60px 20px;">
          🔒 此文件資料尚未解鎖<br>
          <span class="muted">需先完成「${prereqCourses.map(p=>escapeHtml(p.title)).join('、')||'前置課程'}」才能檢視</span>
        </div>
      ` : `
        <div class="card">
          ${draftBannerHtml(selected, admin)}
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="margin:0 0 6px;">${selected.pinned?'⭐ ':''}${escapeHtml(selected.title)}</h3>
              <p class="muted" style="max-width:520px;">${escapeHtml(selected.desc||'')}</p>
              ${selected.targetDepts && selected.targetDepts.length? `<p class="muted" style="margin-top:6px;">適用部門:${selected.targetDepts.map(escapeHtml).join('、')}</p>` : ''}
              ${selected.targetStaffIds && selected.targetStaffIds.length? `<p class="muted" style="margin-top:4px;">適用人員:${selected.targetStaffIds.map(id=>{const s=STATE.staff.find(x=>x.id===id); return s? escapeHtml(s.name): '';}).filter(Boolean).join('、')}</p>` : ''}
              ${prereqCourses.length? `<p class="muted" style="margin-top:4px;">🔗 前置課程:${prereqCourses.map(p=>escapeHtml(p.title)).join('、')}</p>` : ''}
              ${userExempt? '<p class="muted" style="margin-top:4px;">您已豁免此份資料測驗,看完文件即算完成。</p>' : ''}
              ${selected.referenceOnly? '<p class="muted" style="margin-top:4px;">📌 僅供參考資料,不強制要求完成。</p>' : ''}
            </div>
            <div id="watchedPillWrap">
              ${selected.referenceOnly? '<span class="pill off">參考資料</span>' : (!userExempt? (prog && prog.quizPassed? '<span class="pill ok">測驗通過</span>' : (selected.quiz&&selected.quiz.length? '<span class="pill warn">待測驗</span>':'')) : (prog&&prog.watched? '<span class="pill ok">已完成</span>':''))}
            </div>
          </div>
          ${selected.materials && selected.materials.length? `
            <div style="margin-top:14px;">
              <div class="muted" style="margin-bottom:6px;">文件檔案</div>
              ${selected.materials.map(m=>`<div style="margin-bottom:4px;"><a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="btn ghost small" style="text-decoration:none;display:inline-block;">📄 ${escapeHtml(m.name||'文件')}</a></div>`).join('')}
            </div>
          ` : '<div class="muted" style="margin-top:14px;">尚未附加任何文件檔案。</div>'}
          ${selected.referenceOnly? '' : ((selected.quiz && selected.quiz.length && !userExempt)? `<button class="btn ghost small" style="margin-top:14px;" onclick="goToQuiz('${selected.id}')">前往測驗 →</button>`
            : `<button class="btn ghost small" style="margin-top:14px;" onclick="markReadComplete(this,'${selected.id}')" ${prog&&prog.watched?'disabled':''}>${prog&&prog.watched?'已完成閱讀':'我已閱讀完成'}</button>`)}
          ${admin? `
          <div style="margin-top:10px;">
            <button class="btn ${isPublished(selected)?'ghost':'accent'} small" onclick="togglePublish(this,'${selected.id}')">${isPublished(selected)?'⏸ 改回草稿':'✅ 發布給同仁'}</button>
            <button class="btn ghost small" onclick="togglePin(this,'${selected.id}')">${selected.pinned?'取消重要標記':'⭐ 設為重要'}</button>
            <button class="btn ghost small" onclick="showEditCourseForm('${selected.id}',false)">編輯資料</button>
            <button class="icon-btn" style="margin-left:10px;" onclick="deleteCourse(this,'${selected.id}')">刪除此文件資料</button>
          </div>` : ''}
        </div>
      `) : `<div class="card empty">${admin? '尚未選擇文件資料,請先新增或於右側選擇。' : '目前沒有指派給您的文件資料。'}</div>`}
    </div>
    <div class="card">
      ${listHeaderHtml('文件清單', visibleDocs, u, admin)}
      <div class="course-list">
        ${visibleDocs.map((c, idx)=>{
          const p = userProgress(u.id)[c.id];
          const complete = isCourseComplete(u.id, c.id);
          const cLocked = !admin && isPublished(c) && isCourseLocked(u.id, c);
          return categoryHeaderHtml(visibleDocs, idx) + `<div class="course-item ${c.id===STATE.selectedCourseId?'selected':''}" onclick="selectCourse('${c.id}')">
            <div><h4><span style="color:var(--accent);margin-right:6px;">${idx+1}.</span>${cLocked?'🔒 ':''}${c.pinned?'⭐ ':''}${escapeHtml(c.title)}</h4><p>${cLocked? '尚未解鎖' : (c.materials&&c.materials.length? c.materials.length+' 份文件':'')} ${c.quiz&&c.quiz.length? '· '+c.quiz.length+' 題測驗':''} ${(admin && !(c.notifyEmails&&c.notifyEmails.trim()))? '· <span style="color:var(--warn);">尚未設定通知主管</span>':''} ${draftBadgeHtml(c)} ${prereqBadgeHtml(c, admin)}</p></div>
            <span class="pill ${cLocked?'off':(complete?'ok':(p?'warn':'off'))}">${cLocked?'鎖定':(complete?'完成':(p?'待測驗':'未開始'))}</span>
          </div>`;
        }).join('') || '<div class="empty">尚無文件資料</div>'}
      </div>
    </div>
  </div>
  ${((admin || (u && u.canViewRoster)) && selected && isPublished(selected))? courseRosterTableHtml(selected, '閱讀') : ''}
  `;
}

function selectCourse(id){ STATE.selectedCourseId=id; STATE.selectedVideoIndex=0; render(); }
function selectVideo(idx){ STATE.selectedVideoIndex=idx; render(); }

function courseFormInnerHtml(c, requireVideo){
  c = c || {title:'', desc:''};
  const depts = [...new Set(STATE.staff.map(s=>s.dept).filter(Boolean))];
  const targetDepts = c.targetDepts || [];
  const quizExemptDepts = c.quizExemptDepts || [];
  const chk = (cls, val, checked, label) => `<label style="display:flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;"><input type="checkbox" class="${cls}" value="${val}" ${checked?'checked':''}> ${label}</label>`;
  const sec = (title, hint) => `<div style="font-weight:700;font-size:14px;margin:24px 0 4px;padding-top:14px;border-top:1px solid var(--border);">${title}</div>${hint? `<div class="muted" style="margin-bottom:10px;">${hint}</div>`:''}`;
  return `
    <div class="form-row">
      <input type="text" id="courseFormTitle" placeholder="${requireVideo?'課程名稱':'文件資料名稱'}" value="${escapeHtml(c.title)}">
    </div>
    <textarea id="courseFormDesc" placeholder="${requireVideo?'課程說明(選填)':'說明(選填)'}">${escapeHtml(c.desc||'')}</textarea>
    <div class="form-row" style="margin:8px 0;">
      <input type="text" id="courseFormCategory" list="courseCategoryList" style="width:100%;" placeholder="分類(例如:手術、美療、護理;留空則依課程名稱「分類-名稱」自動判斷)" value="${escapeHtml(c.category||'')}">
      <datalist id="courseCategoryList">${[...new Set(PREFERRED_CATEGORY_ORDER.concat(STATE.courses.map(courseCategory).filter(k=>k!=='其他')))].map(k=>`<option value="${escapeHtml(k)}">`).join('')}</datalist>
    </div>
    <div style="background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:10px 0;">
      <div style="font-weight:700;margin-bottom:6px;">發布狀態</div>
      <select id="courseFormStatus" style="width:100%;">
        <option value="draft" ${(c.id && isPublished(c))? '' : 'selected'}>📝 草稿 — 隱藏,一般同仁看不到(管理員與主管可預覽)</option>
        <option value="published" ${(c.id && isPublished(c))? 'selected' : ''}>✅ 已發布 — 指定的對象就看得到</option>
      </select>
      <div class="muted" style="margin-top:6px;line-height:1.6;">做到一半、或要等主管確認時,請選「草稿」,內容可以還沒填完整。確認沒問題後,在課程頁面按「✅ 發布給同仁」即可。</div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:6px;cursor:pointer;background:var(--accent-soft);padding:8px 12px;border-radius:8px;">
      <input type="checkbox" id="courseFormReferenceOnly" ${c.referenceOnly?'checked':''}>
      僅供參考資料(不強制要求任何人完成,不會出現在待辦名單或計入完成率)
    </label>

    ${sec('① 誰需要上這堂課(指派對象)', '只有被勾選的部門/人員才看得到這堂課。<b>部門和人員都不勾 = 全部人員都看得到</b>。')}
    <div class="muted" style="margin:8px 0;">適用部門(整個部門都需要)</div>
    <div id="deptChecklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      ${depts.length? depts.map(d=>chk('deptCheck', escapeHtml(d), targetDepts.includes(d), escapeHtml(d))).join('') : '<span class="muted">尚無部門資料,請先在「人員管理」為同仁填寫部門/職稱</span>'}
    </div>
    <div class="muted" style="margin:8px 0;">適用人員(只指定特定人,例如同部門裡的新人;與上面部門是「符合任一個就看得到」)</div>
    ${personPickerHtml('target', depts)}

    ${sec('② 課程內容')}
    ${requireVideo? `
    <div class="muted" style="margin:8px 0;">影片(YouTube連結,建議設為不公開,可新增多支;純文字/文件也可以不放影片)</div>
    <div id="videoBuilder"></div>
    <div class="form-row" style="margin-top:4px;margin-bottom:14px;">
      <button class="btn ghost small" onclick="addVideoRow()">+ 新增影片</button>
    </div>
    ` : ''}
    <div class="muted" style="margin:8px 0;">${requireVideo?'課程講義':'文件檔案'}(PDF連結,可新增多份)</div>
    <div id="materialBuilder"></div>
    <div class="form-row" style="margin-top:4px;margin-bottom:14px;">
      <button class="btn ghost small" onclick="addMaterialRow()">+ 新增${requireVideo?'講義':'文件'}</button>
    </div>

    ${sec('③ 學習路徑(選填,不需要就全部不勾)', '設定後,要先完成前置課程才能看這堂。注意:「鎖定豁免」只是不受前置限制,<b>不等於指派</b>,不會讓對方多看到這堂課。')}
    <div class="muted" style="margin:8px 0;">前置課程(可複選,全部完成後這堂才會解鎖)</div>
    <div id="prerequisiteChecklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;max-height:180px;overflow-y:auto;padding:4px;">
      ${(()=>{
        const others = STATE.courses.filter(x=>x.id!==c.id);
        if(!others.length) return '<span class="muted">目前沒有其他課程可設為前置課程</span>';
        const prereqIds = coursePrerequisiteIds(c);
        return others.map(x=>chk('prerequisiteCheck', x.id, prereqIds.includes(x.id), escapeHtml(x.title))).join('');
      })()}
    </div>
    <div class="muted" style="margin:8px 0;">鎖定豁免部門(這些部門不受前置課程限制,可直接觀看)</div>
    <div id="lockExemptDeptChecklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      ${depts.length? depts.map(d=>chk('lockExemptDeptCheck', escapeHtml(d), (c.lockExemptDepts||[]).includes(d), escapeHtml(d))).join('') : '<span class="muted">尚無部門資料</span>'}
    </div>
    <div class="muted" style="margin:8px 0;">鎖定豁免人員(這些人不受前置課程限制,可直接觀看)</div>
    ${personPickerHtml('lockExempt', depts)}

    ${sec('④ 測驗')}
    <div class="muted" style="margin:8px 0;">測驗題目(選填;不放題目 = 不用考試)</div>
    <div id="qBuilder"></div>
    <div class="form-row" style="margin-top:8px;margin-bottom:14px;">
      <button class="btn ghost small" onclick="addQuestionRow()">+ 新增題目</button>
    </div>
    <div class="muted" style="margin:8px 0;">測驗豁免部門(這些部門只需看完影片,不需要通過測驗)</div>
    <div id="quizExemptDeptChecklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      ${depts.length? depts.map(d=>chk('quizExemptDeptCheck', escapeHtml(d), quizExemptDepts.includes(d), escapeHtml(d))).join('') : '<span class="muted">尚無部門資料</span>'}
    </div>
    <div class="muted" style="margin:8px 0;">測驗豁免人員(這些人只需看完影片,不需要通過測驗)</div>
    ${personPickerHtml('exempt', depts)}

    ${sec('⑤ 未達標通知')}
    <div class="muted" style="margin:8px 0;">通知主管(選填;此課程未達標時週報要通知的人,可複選;都不勾則用預設通知信箱)</div>
    <div id="notifyManagerChecklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      ${(()=>{
        const managers = STATE.staff.filter(s=>s.isManager && s.email);
        if(!managers.length) return '<span class="muted">尚無標記為「主管」且有填Email的人員,請先在「人員管理」勾選</span>';
        const currentEmails = (c.notifyEmails||'').split(',').map(e=>e.trim().toLowerCase()).filter(Boolean);
        return managers.map(a=>chk('notifyManagerCheck', escapeHtml(a.email), currentEmails.includes(a.email.trim().toLowerCase()), escapeHtml(a.name))).join('');
      })()}
    </div>
  `;
}

function personPickerHtml(kind, depts){
  return `
    <div class="form-row" style="margin-bottom:8px;">
      <select id="${kind}DeptFilterSelect" class="field" onchange="renderPersonChecklist('${kind}')">
        <option value="">— 先選部門,才會列出該部門人員 —</option>
        ${depts.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
      </select>
    </div>
    <div id="${kind}Checklist" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;max-height:180px;overflow-y:auto;padding:4px;"></div>
    <div id="${kind}SelectedSummary" class="muted" style="margin-bottom:14px;"></div>
  `;
}

let __courseFormStaffIds = new Set();
let __courseFormQuizExemptIds = new Set();
let __courseFormLockExemptIds = new Set();

function personSet(kind){
  if(kind==='exempt') return __courseFormQuizExemptIds;
  if(kind==='lockExempt') return __courseFormLockExemptIds;
  return __courseFormStaffIds;
}

function renderPersonChecklist(kind){
  const filterEl = document.getElementById(kind+'DeptFilterSelect');
  if(!filterEl) return;
  const filterVal = filterEl.value;
  const container = document.getElementById(kind+'Checklist');
  const set = personSet(kind);
  const filtered = filterVal? STATE.staff.filter(s=>s.dept===filterVal) : [];
  container.innerHTML = filtered.length
    ? filtered.map(s=>`<label style="display:flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;"><input type="checkbox" onchange="togglePersonCheck('${kind}','${s.id}', this.checked)" ${set.has(s.id)?'checked':''}> ${escapeHtml(s.name)}</label>`).join('')
    : (filterVal? '<span class="muted">此部門尚無人員</span>' : '<span class="muted">請先在上方選擇部門</span>');
  renderPersonSummary(kind);
}
function togglePersonCheck(kind, id, checked){
  const set = personSet(kind);
  if(checked) set.add(id); else set.delete(id);
  renderPersonSummary(kind);
}
function renderPersonSummary(kind){
  const el = document.getElementById(kind+'SelectedSummary');
  if(!el) return;
  const set = personSet(kind);
  const emptyText = kind==='exempt'? '目前沒有人豁免測驗。' : (kind==='lockExempt'? '目前沒有人豁免鎖定。' : '目前尚未指定任何人員。');
  if(set.size===0){ el.textContent = emptyText; return; }
  const names = Array.from(set).map(id=>{ const s=STATE.staff.find(x=>x.id===id); return s? s.name : null; }).filter(Boolean);
  el.textContent = ((kind==='exempt'||kind==='lockExempt')? '已豁免(':'已選擇(')+names.length+'):'+names.join('、');
}

function addVideoRow(prefill){
  const b = document.getElementById('videoBuilder');
  const row = document.createElement('div');
  row.className='form-row';
  row.innerHTML = `
    <input type="text" class="videoName" placeholder="影片名稱(例如:前導片、正片)" value="${escapeHtml(prefill? prefill.name:'')}">
    <input type="text" class="videoUrl2" placeholder="YouTube 影片連結" value="${escapeHtml(prefill? prefill.url:'')}">
    <button class="icon-btn" onclick="this.parentElement.remove()">移除</button>
  `;
  b.appendChild(row);
}

let __courseFormRequireVideo = true;

function showAddCourseForm(requireVideo){
  __courseFormRequireVideo = (requireVideo!==false);
  __courseFormStaffIds = new Set();
  __courseFormQuizExemptIds = new Set();
  __courseFormLockExemptIds = new Set();
  const wrap = document.getElementById('addCourseFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">${__courseFormRequireVideo? '新增課程':'新增文件資料'}</div>
      ${courseFormInnerHtml(null, __courseFormRequireVideo)}
      <div class="form-row" style="margin-top:10px;">
        <button class="btn accent" onclick="submitNewCourse(this)">儲存</button>
        <button class="btn ghost" onclick="document.getElementById('addCourseFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
  if(__courseFormRequireVideo) addVideoRow();
  addQuestionRow();
  renderPersonChecklist('target');
  renderPersonChecklist('exempt');
  renderPersonChecklist('lockExempt');
}

function showEditCourseForm(id, requireVideo){
  __courseFormRequireVideo = (requireVideo!==false);
  const c = STATE.courses.find(x=>x.id===id);
  if(!c) return;

  __courseFormLockExemptIds = new Set(c.lockExemptStaffIds || []);
  const wrap = document.getElementById('addCourseFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">${__courseFormRequireVideo? '編輯課程':'編輯文件資料'}</div>
      ${courseFormInnerHtml(c, __courseFormRequireVideo)}
      <div class="form-row" style="margin-top:10px;">
        <button class="btn accent" onclick="submitEditCourse(this,'${id}')">儲存變更</button>
        <button class="btn ghost" onclick="document.getElementById('addCourseFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
  if(__courseFormRequireVideo){
    const vids = courseVideos(c);
    (vids.length? vids : [null]).forEach(v=> addVideoRow(v));
  }
  (c.quiz && c.quiz.length? c.quiz : [null]).forEach(q=> addQuestionRow(q));
  (c.materials || []).forEach(m=> addMaterialRow(m));
  renderPersonChecklist('target');
  renderPersonChecklist('exempt');
  renderPersonChecklist('lockExempt');
  wrap.scrollIntoView({behavior:'smooth'});
}

let __qUid = 0;
function optionRowHtml(gid, text, checked, multi, n){
  return `<div class="opt-row">
    <input type="${multi?'checkbox':'radio'}" class="qcorrect" name="${gid}" ${checked?'checked':''} title="勾選 = 這個選項是正確答案">
    <input type="text" class="qopt" placeholder="選項 ${String.fromCharCode(65+n)}" value="${escapeHtml(text||'')}">
    <button class="icon-btn" type="button" onclick="removeQuestionOption(this)">移除選項</button>
  </div>`;
}
function relabelOptions(row){
  Array.from(row.querySelectorAll('.qoptions .opt-row')).forEach((r,n)=>{
    r.querySelector('.qopt').placeholder = '選項 '+String.fromCharCode(65+n);
  });
}
function addQuestionRow(prefill){
  const b = document.getElementById('qBuilder');
  const idx = b.children.length;
  const row = document.createElement('div');
  row.className = 'quiz-q';
  const gid = 'qc' + (++__qUid);
  row.dataset.gid = gid;
  const multi = !!(prefill && prefill.multi);
  const opts = (prefill && prefill.options && prefill.options.length)? prefill.options : ['','','',''];
  const correct = prefill? correctSet(prefill) : [];
  row.innerHTML = `
    <input type="text" class="qtext" placeholder="題目 ${idx+1}" value="${escapeHtml(prefill? prefill.q:'')}">
    <div class="opt-row">
      <span class="muted">題型:</span>
      <select class="qtype field" style="flex:none;min-width:0;width:auto;" onchange="onQuestionTypeChange(this)">
        <option value="single" ${multi?'':'selected'}>單選題(只有 1 個正確答案)</option>
        <option value="multi" ${multi?'selected':''}>複選題(可有多個正確答案,需全部選對才算對)</option>
      </select>
    </div>
    <div class="muted" style="margin-top:6px;">請在「正確答案」的選項前面勾選(單選題只能勾 1 個)</div>
    <div class="qoptions">${opts.map((o,n)=>optionRowHtml(gid, o, correct.includes(n), multi, n)).join('')}</div>
    <div class="opt-row">
      <button class="btn ghost small" type="button" onclick="addQuestionOption(this)">+ 新增選項</button>
      <button class="icon-btn" type="button" onclick="this.closest('.quiz-q').remove()">移除題目</button>

function addQuestionOption(btn){
  const row = btn.closest('.quiz-q');
  const list = row.querySelector('.qoptions');
  const n = list.children.length;
  if(n>=6){ alert('每題最多 6 個選項'); return; }
  const multi = row.querySelector('.qtype').value==='multi';
  list.insertAdjacentHTML('beforeend', optionRowHtml(row.dataset.gid, '', false, multi, n));
}
function removeQuestionOption(btn){
  const row = btn.closest('.quiz-q');
  const list = row.querySelector('.qoptions');
  if(list.children.length<=2){ alert('每題至少要有 2 個選項'); return; }

function onQuestionTypeChange(sel){
  const row = sel.closest('.quiz-q');
  const multi = sel.value==='multi';
  const controls = Array.from(row.querySelectorAll('.qcorrect'));
  const checkedIdx = controls.map((c,i)=>c.checked? i : -1).filter(i=>i>=0);
  controls.forEach(c=>{ c.checked = false; c.type = multi? 'checkbox' : 'radio'; });
  const keep = multi? checkedIdx : checkedIdx.slice(0,1);
  keep.forEach(i=>{ controls[i].checked = true; });
}

function readCourseForm(){
  const title = document.getElementById('courseFormTitle').value.trim();
  const desc = document.getElementById('courseFormDesc').value.trim();
  const status = document.getElementById('courseFormStatus').value;
  const referenceOnly = document.getElementById('courseFormReferenceOnly').checked;
  const category = document.getElementById('courseFormCategory').value.trim();
  const prerequisiteIds = Array.from(document.querySelectorAll('.prerequisiteCheck:checked')).map(el=>el.value);
  const notifyEmails = Array.from(document.querySelectorAll('.notifyManagerCheck:checked')).map(el=>el.value).join(',');
  const targetDepts = Array.from(document.querySelectorAll('.deptCheck:checked')).map(el=>el.value);
  const targetStaffIds = Array.from(__courseFormStaffIds);
  const quizExemptDepts = Array.from(document.querySelectorAll('.quizExemptDeptCheck:checked')).map(el=>el.value);
  const quizExemptStaffIds = Array.from(__courseFormQuizExemptIds);
  const lockExemptDepts = Array.from(document.querySelectorAll('.lockExemptDeptCheck:checked')).map(el=>el.value);
  const lockExemptStaffIds = Array.from(__courseFormLockExemptIds);
  const videoRows = document.querySelectorAll('#videoBuilder .form-row');
  const videos = [];
  let hasInvalidVideo = false;
  videoRows.forEach(row=>{
    const name = row.querySelector('.videoName').value.trim();
    const url = row.querySelector('.videoUrl2').value.trim();
    if(url){
      videos.push({name: name || ('影片'+(videos.length+1)), url});
      if(!ytId(url)) hasInvalidVideo = true;
    }
  });
  const qRows = document.querySelectorAll('#qBuilder .quiz-q');
  const quiz = [];
  qRows.forEach(row=>{
    const qtext = row.querySelector('.qtext').value.trim();
    const opts = Array.from(row.querySelectorAll('.qopt')).map(o=>o.value.trim());
    const multi = row.querySelector('.qtype').value==='multi';
    const correct = Array.from(row.querySelectorAll('.qcorrect')).map((c,i)=>c.checked? i : -1).filter(i=>i>=0);
    if(!qtext && opts.every(o=>!o)) return; // a completely empty question row is simply ignored
    // kept as typed even if unfinished; "can this be shown to staff" is checked when publishing (publishProblems)
    quiz.push(multi? {q:qtext, options:opts, multi:true, answers:correct, answer:correct[0]} : {q:qtext, options:opts, answer:correct[0]});
  });
  const matRows = document.querySelectorAll('#materialBuilder .form-row');
  const materials = [];
  matRows.forEach(row=>{
    const name = row.querySelector('.matname').value.trim();
    const url = row.querySelector('.materialUrl').value.trim();
    if(url) materials.push({name: name || '講義', url});
  });
  return {status, title, desc, category, referenceOnly, prerequisiteIds, notifyEmails, videos, hasInvalidVideo, quiz, materials, targetDepts, targetStaffIds, quizExemptDepts, quizExemptStaffIds, lockExemptDepts, lockExemptStaffIds};
}

function lockBtn(btn, loadingLabel){
  if(!btn) return ()=>{};
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = loadingLabel;
  return ()=>{ btn.disabled=false; btn.textContent=original; };
}

// Draft = save whatever has been typed. Published = everything must be complete, and the person confirms who will see it.
function checkBeforeSave(f, wasPublished){
  if(f.status!=='published'){
    if(wasPublished && !confirm('改成草稿後,同仁會暫時看不到這'+(__courseFormRequireVideo?'堂課':'份資料')+'(他們已有的觀看與測驗紀錄會保留)。\n\n確定要改成草稿嗎?')) return false;
    return true;
  }
  const problems = publishProblems({title:f.title, kind: __courseFormRequireVideo? 'course':'doc', referenceOnly:f.referenceOnly, videos:f.videos, quiz:f.quiz});
  if(problems.length){
    alert('這'+(__courseFormRequireVideo?'堂課':'份資料')+'還不能發布,尚未儲存。請先處理:\n・'+problems.join('\n・')+'\n\n(如果還沒做完,可以把「發布狀態」改成「草稿」再儲存)');
    return false;
  }
  if(!wasPublished){
    return confirm('儲存後,「'+audienceText(f)+'」就會看到這'+(__courseFormRequireVideo?'堂課':'份資料')+'。\n\n確定要發布嗎?\n(還沒確認好,請按「取消」,把「發布狀態」改成草稿)');
  }
  if(!f.targetDepts.length && !f.targetStaffIds.length){
    return confirm('這堂課沒有指定任何「適用部門」或「適用人員」,所有人員都會看到。\n\n確定要這樣儲存嗎?\n(要指定對象,請按「取消」,到表單的「① 誰需要上這堂課」勾選)');
  }
  return true;
}

async function submitNewCourse(btn){
  const f = readCourseForm();
  if(!f.title){ alert(__courseFormRequireVideo? '請填寫課程名稱' : '請填寫文件資料名稱'); return; }
  if(!checkBeforeSave(f, false)) return;
  const restore = lockBtn(btn, '儲存中...');
  const course = {id:uid(), published: f.status==='published', kind: __courseFormRequireVideo? 'course':'doc', title:f.title, desc:f.desc, category:f.category, referenceOnly:f.referenceOnly, prerequisiteIds:f.prerequisiteIds, notifyEmails:f.notifyEmails, videos:f.videos, videoUrl:f.videos[0]? f.videos[0].url:'', quiz:f.quiz, materials:f.materials, targetDepts:f.targetDepts, targetStaffIds:f.targetStaffIds, quizExemptDepts:f.quizExemptDepts, quizExemptStaffIds:f.quizExemptStaffIds, lockExemptDepts:f.lockExemptDepts, lockExemptStaffIds:f.lockExemptStaffIds};
  try{ await saveCourse(course); }
  catch(e){ alert('無法連線到資料庫,這堂課尚未儲存,請確認網路連線後再試一次。'); restore(); return; }
  try{
    const idx = await loadCourseIndex();
    if(!idx.includes(course.id)){ idx.push(course.id); await saveCourseIndex(idx); }
  }catch(e){ console.error('更新課程索引失敗(課程本身已儲存)', e); }
  STATE.courses.push(course);
  STATE.selectedCourseId = course.id;
  document.getElementById('addCourseFormWrap').innerHTML='';
  render();
}

async function submitEditCourse(btn, id){
  const f = readCourseForm();
  if(!f.title){ alert(__courseFormRequireVideo? '請填寫課程名稱' : '請填寫文件資料名稱'); return; }
  if(!checkBeforeSave(f, (()=>{ const ex = STATE.courses.find(x=>x.id===id); return !!ex && isPublished(ex); })())) return;
  const restore = lockBtn(btn, '儲存中...');
  let c;
  try{ c = await loadCourse(id); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  if(!c || c.deleted){ alert('找不到這筆資料,可能已被其他人刪除,請重新整理頁面。'); restore(); return; }
  c.published = (f.status==='published'); if(!c.kind) c.kind = __courseFormRequireVideo? 'course':'doc';
  c.title = f.title; c.desc = f.desc; c.category = f.category; c.referenceOnly = f.referenceOnly; c.prerequisiteIds = f.prerequisiteIds; c.notifyEmails = f.notifyEmails;
  if(__courseFormRequireVideo){ c.videos = f.videos; c.videoUrl = f.videos[0]? f.videos[0].url:''; }

  c.quizExemptDepts = f.quizExemptDepts; c.quizExemptStaffIds = f.quizExemptStaffIds;
  c.lockExemptDepts = f.lockExemptDepts; c.lockExemptStaffIds = f.lockExemptStaffIds;

  catch(e){ alert('無法連線到資料庫,修改尚未儲存,請確認網路連線後再試一次。'); restore(); return; }
  const ci = STATE.courses.findIndex(x=>x.id===id);
  if(ci>=0) STATE.courses[ci] = c; else STATE.courses.push(c);
