/* ---- Watch tracking ----
   Counts the time actually played, saves on pause / end / leaving the page, tells the person if a save did not
   go through, and keeps retrying until it does. */
let __playingSince = null;     // when the current stretch of playing began (ms)
let __watchCourseId = null;    // the course that stretch belongs to (stays correct even if the page changes)
let __watchSaving = false;
let __watchDirty = false;      // something is waiting to be saved
let __watchDirtyUser = null;

function setSaveStatus(kind){
  const el = document.getElementById('watchSaveStatus');
  if(!el) return;
  if(kind==='saved'){ el.textContent = '✓ 觀看進度已儲存'; el.style.color = 'var(--ok)'; }
  else if(kind==='failed'){ el.textContent = '⚠ 觀看進度尚未儲存成功,請先不要關閉此頁面並確認網路,系統會自動重試'; el.style.color = '#b06a54'; }
  else { el.textContent = '觀看進度儲存中…'; el.style.color = 'var(--sub)'; }
}

function startWatch(){
  if(__playingSince===null){ __playingSince = Date.now(); __watchCourseId = STATE.selectedCourseId; }
  if(!watchTimer) watchTimer = setInterval(()=>{ recordWatch(false); }, 10000);
}

// Add the time played since the last mark to this person's progress (in memory). Returns true if anything changed.
function accrueWatch(forceWatched){
  const u = currentUser();
  const cid = __watchCourseId || STATE.selectedCourseId;
  if(!u || !cid) return false;
  const watchedCourse = STATE.courses.find(c=>c.id===cid);
  if(watchedCourse && !isPublished(watchedCourse)){ __playingSince = null; return false; } // draft preview is never recorded
  let sec = 0;
  if(__playingSince!==null){
    const now = Date.now();
    sec = Math.min(Math.max(Math.round((now - __playingSince)/1000), 0), 60);
    __playingSince = now;
  }
  if(sec<=0 && !forceWatched) return false;
  const mine = STATE.progress[u.id] || (STATE.progress[u.id] = {});
  if(!mine[cid]) mine[cid] = {watchSeconds:0, watched:false, quizPassed:false};
  const p = mine[cid];
  p.watchSeconds = (p.watchSeconds||0) + sec;
  p.lastWatchedAt = new Date().toISOString();
  const justWatched = !p.watched && (p.watchSeconds >= 20 || forceWatched);
  if(p.watchSeconds >= 20 || forceWatched) p.watched = true;
  // Update the on-screen label/pill directly — do NOT call render() here,
  // it would destroy and recreate the YouTube player mid-playback.
  if(cid === STATE.selectedCourseId){
    const label = document.getElementById('watchTimeLabel');
    if(label){
      label.textContent = `累計觀看時間:${Math.floor((p.watchSeconds||0)/60)} 分 ${Math.floor((p.watchSeconds||0)%60)} 秒`;
    }
    if(justWatched){
      const pillWrap = document.getElementById('watchedPillWrap');
      if(pillWrap){
        const course = STATE.courses.find(c=>c.id===cid);
        pillWrap.innerHTML = `
          <span class="pill ok">已觀看</span>
          ${p.quizPassed? '<span class="pill ok">測驗通過</span>' : (course && course.quiz && course.quiz.length? '<span class="pill warn">待測驗</span>':'')}
        `;
      }
    }
  }
  __watchDirty = true;
  __watchDirtyUser = u.id;
  return true;
}

// Save this person's row. If a save is already running it will pick up the newer changes when it finishes.
async function flushWatchSave(){
  if(__watchSaving || !__watchDirty) return;
  __watchSaving = true;
  setSaveStatus('pending');
  try{
    while(__watchDirty){
      const uid = __watchDirtyUser;
      __watchDirty = false;
      await saveStaffProgress(uid, STATE.progress[uid]);
    }
    setSaveStatus('saved');
  }catch(err){
    __watchDirty = true;
    console.error('觀看進度儲存失敗,系統會自動重試', err);
    setSaveStatus('failed');
  }finally{
    __watchSaving = false;
  }
}

async function recordWatch(forceWatched){
  accrueWatch(forceWatched);
  await flushWatchSave();
}

async function stopWatch(forceWatched){
  clearInterval(watchTimer); watchTimer = null;
  accrueWatch(!!forceWatched);
  __playingSince = null;
  await flushWatchSave();
}

async function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){
    startWatch();
  } else if(e.data === YT.PlayerState.ENDED){
    await stopWatch(true);
  } else if(e.data === YT.PlayerState.PAUSED){
    await stopWatch(false);
  }
}

// Best-effort send when the page is being closed or hidden.
function sendProgressBeacon(){
  try{
    accrueWatch(false);
    if(!__watchDirty || !__watchDirtyUser) return;
    const body = JSON.stringify({ key: PROGRESS_PREFIX+__watchDirtyUser, value: JSON.stringify(STATE.progress[__watchDirtyUser]) });
    navigator.sendBeacon(API_URL, body);
  }catch(err){}
}
window.addEventListener('pagehide', sendProgressBeacon);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') sendProgressBeacon(); });
window.addEventListener('beforeunload', ev=>{ if(__watchDirty || __watchSaving){ ev.preventDefault(); ev.returnValue = ''; } });
setInterval(()=>{ if(__watchDirty && !__watchSaving) flushWatchSave(); }, 15000);

function goToQuiz(courseId){
  STATE.selectedCourseId = courseId;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view==='quiz'));
  STATE.view='quiz';
  STATE.quizAnswers={};
  STATE.quizResult=null;
  render();
}

function goToCourseEdit(courseId){
  STATE.selectedCourseId = courseId;
  const course = STATE.courses.find(c=>c.id===courseId);
  const targetView = (course && courseTab(course)==='course')? 'courses' : 'documents';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===targetView));
  STATE.view = targetView;
  render();
  showEditCourseForm(courseId, targetView==='courses');
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  const u = currentUser();
  const admin = isAdmin();
  const scopedCourses = visibleCoursesFor(u, admin);
  const withQuiz = scopedCourses.filter(c=>c.quiz && c.quiz.length && (admin || (!isQuizExempt(u, c) && !isCourseLocked(u.id, c))));
  const selected = withQuiz.find(c=>c.id===STATE.selectedCourseId) || withQuiz[0];

  return `
  <div class="topbar"><h1>測驗中心</h1></div>
  <div class="two-col">
    <div>
      ${selected? renderQuizBody(selected, u) : '<div class="card empty">目前沒有附測驗的課程。可於「課程與影片」新增課程時加入測驗題目。</div>'}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">選擇測驗課程</div>
      <div class="course-list">
        ${withQuiz.map(c=>{
          const p = userProgress(u.id)[c.id];
          return `<div class="course-item ${selected&&c.id===selected.id?'selected':''}" onclick="selectQuizCourse('${c.id}')">
            <div><h4>${isPublished(c)? '' : '📝 '}${escapeHtml(c.title)}</h4><p>${c.quiz.length} 題${isPublished(c)? '' : ' · 草稿(試做不記錄)'}</p></div>
            <span class="pill ${p&&p.quizPassed?'ok':'off'}">${p&&p.quizPassed?'已通過 '+p.quizScore+'%':'未測驗'}</span>
          </div>`;
        }).join('') || '<div class="empty">尚無測驗</div>'}
      </div>
    </div>
  </div>
  `;
}
function selectQuizCourse(id){ STATE.selectedCourseId=id; STATE.quizAnswers={}; STATE.quizResult=null; render(); }

function toggleQuizAnswer(qi, oi, checked){
  const set = new Set(Array.isArray(STATE.quizAnswers[qi])? STATE.quizAnswers[qi] : []);
  if(checked) set.add(oi); else set.delete(oi);
  STATE.quizAnswers[qi] = Array.from(set).sort((a,b)=>a-b);
}

function renderQuizBody(course, u){
  if(STATE.quizResult && STATE.quizResult.courseId===course.id){
    const r = STATE.quizResult;
    return `
    <div class="card">
      <div class="result-banner ${r.passed?'pass':'fail'}">${r.passed? '✓ 測驗通過':'✗ 未達通過標準'} — 得分 ${r.score}%(答對 ${r.correct}/${r.total} 題)${r.preview? ' ・草稿試做,成績不會被記錄':''}</div>
      ${r.details.map((d,i)=>questionReviewHtml(d,i)).join('')}
      <button class="btn ghost small" onclick="STATE.quizResult=null;STATE.quizAnswers={};render();">重新測驗</button>
    </div>`;
  }
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <h3 style="margin-top:0;">${escapeHtml(course.title)} — 測驗</h3>
      ${isAdmin()? `<button class="btn ghost small" onclick="goToCourseEdit('${course.id}')">編輯此測驗</button>` : ''}
    </div>
    ${course.quiz.map((q,i)=>`
      <div class="quiz-q">
        <div style="font-weight:600;margin-bottom:6px;">${i+1}. ${escapeHtml(q.q)}${q.multi? ' <span class="pill warn" style="margin-left:6px;">複選題</span>':''}</div>
        ${q.multi? '<div class="muted" style="margin-bottom:6px;">請勾選所有正確答案(需要全部選對才算對)</div>' : ''}
        ${q.options.map((opt,oi)=> q.multi
          ? `<div class="opt-row"><input type="checkbox" id="q${i}_${oi}" onchange="toggleQuizAnswer(${i},${oi},this.checked)"><label for="q${i}_${oi}">${escapeHtml(opt)}</label></div>`
          : `<div class="opt-row"><input type="radio" name="q${i}" id="q${i}_${oi}" value="${oi}" onchange="STATE.quizAnswers[${i}]=${oi}"><label for="q${i}_${oi}">${escapeHtml(opt)}</label></div>`
        ).join('')}
      </div>
    `).join('')}
    <button class="btn accent" onclick="submitQuiz(this,'${course.id}')">送出答案</button>
  </div>
  `;
}

async function submitQuiz(btn, courseId){
  const course = STATE.courses.find(c=>c.id===courseId);
  const u = currentUser();
  const unansweredCount = course.quiz.filter((q,i)=> toArr(STATE.quizAnswers[i]).length===0).length;
  if(unansweredCount>0 && !confirm('還有 '+unansweredCount+' 題尚未作答,送出後這幾題會算答錯。\n\n確定要送出嗎?')) return;
  let correct = 0;
  const details = course.quiz.map((q,i)=>{
    const selected = STATE.quizAnswers[i];
    const isCorrect = gradeQuestion(q, selected);
    if(isCorrect) correct++;
    return {q:q.q, options:q.options, selected, correct: q.multi? q.answers : q.answer, isCorrect, multi: !!q.multi};
  });
  const total = course.quiz.length;
  const score = Math.round(correct/total*100);
  const passed = score >= 70;
  if(!isPublished(course)){
    // draft: let the manager try it out and see the result, but record nothing
    STATE.quizResult = {courseId, correct, total, score, passed, details, preview:true};
    render();
    return;
  }
  const restore = lockBtn(btn, '送出中...');
  let mine;
  try{ mine = await fetchOwnProgress(u.id); }catch(e){ alert('無法連線到資料庫,測驗結果尚未儲存,請確認網路連線後重新送出。'); restore(); return; }
  if(!mine[courseId]) mine[courseId] = {watchSeconds:0, watched:false, quizPassed:false};
  const p = mine[courseId];
  const submittedAt = new Date().toISOString();
  p.quizScore = score;
  p.quizPassed = passed;
  p.quizSubmittedAt = submittedAt;
  delete p.quizDetails;
  const history = (p.quizHistory || []).slice();
  history.push({
    score, passed, submittedAt,
    answers: details.map(d=>(d.selected===undefined? null : d.selected)),
    ok: details.map(d=>d.isCorrect? 1:0),
    qsig: quizSig(course.quiz)
  });
  const oneYearAgo = Date.now() - 365*24*60*60*1000;
  p.quizHistory = history.filter(h=> new Date(h.submittedAt).getTime() >= oneYearAgo);
  try{ await saveStaffProgress(u.id, mine); }
  catch(e){ alert('無法連線到資料庫,測驗結果尚未儲存,請確認網路連線後重新送出。'); restore(); return; }
  STATE.progress[u.id] = mine;
  STATE.quizResult = {courseId, correct, total, score, passed, details};
  render();
}

/* ---------- Staff ---------- */
function renderStaff(){
  return `
  <div class="topbar">
    <h1>人員管理</h1>
    <button class="btn accent" onclick="showAddStaffForm()">+ 新增人員</button>
  </div>
  <div id="addStaffFormWrap"></div>
  <div class="card">
    <div class="muted" style="margin-bottom:12px;">每位管理員的密碼各自獨立,可在下方點「編輯」個別設定或修改。</div>
    <table>
      <thead><tr><th>姓名</th><th>部門/職稱</th><th>Email</th><th>身分</th><th>最後登入</th><th>整體完成率</th><th></th></tr></thead>
      <tbody>
        ${sortedStaff().map(s=>{
          const myCourses = coursesForStaff(s);
          const total = myCourses.length;
          let done=0;
          myCourses.forEach(c=>{ if(isCourseComplete(s.id, c.id)) done++; });
          const pct = total? Math.round(done/total*100):0;
          const lastLogin = userProgress(s.id)._lastLogin;
          return `<tr ${s.isManager? 'style="background:var(--accent-soft);"':''}>
            <td>${escapeHtml(s.name)} ${s.isManager? '<span class="pill ok">主管</span>':''}</td>
            <td>${escapeHtml(s.dept||'-')}</td>
            <td>${escapeHtml(s.email||'-')}</td>
            <td><span class="pill ${s.role==='admin'?'warn':'off'}">${s.role==='admin'?'管理員':'一般人員'}</span></td>
            <td class="muted">${fmtTime(lastLogin)}</td>
            <td><span class="pill ${pct>=100?'ok':(pct>0?'warn':'off')}">${pct}%</span></td>
            <td><button class="icon-btn" onclick="showEditStaffForm('${s.id}')">編輯</button> <button class="icon-btn" onclick="deleteStaff(this,'${s.id}')">刪除</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}
function staffFormHtml(s){
  s = s || {name:'', dept:'', email:'', role:'staff'};
  return `
    <div class="form-row">
      <input type="text" id="staffFormName" placeholder="姓名" value="${escapeHtml(s.name)}">
      <input type="text" id="staffFormDept" placeholder="部門/職稱" value="${escapeHtml(s.dept)}">
      <input type="email" id="staffFormEmail" placeholder="Email(用來驗證身分,建議務必填寫)" value="${escapeHtml(s.email)}">
      <select class="field" id="staffFormRole" style="max-width:140px;">
        <option value="staff" ${s.role!=='admin'?'selected':''}>一般人員</option>
        <option value="admin" ${s.role==='admin'?'selected':''}>管理員</option>
      </select>
    </div>
    <div id="staffFormPasswordWrap" style="display:${s.role==='admin'?'':'none'};margin-bottom:10px;">
      <input type="password" id="staffFormPassword" class="field" style="width:100%;" placeholder="${s.password? '管理員密碼(留空 = 不更動)' : '設定此管理員的專屬密碼'}">
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:14px;cursor:pointer;">
      <input type="checkbox" id="staffFormCanViewRoster" ${s.canViewRoster?'checked':''}>
      允許查看課程名單(可看到每堂課誰看過、誰測驗過,不需要完整管理員權限)
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:14px;cursor:pointer;">
      <input type="checkbox" id="staffFormIsManager" ${s.isManager?'checked':''}>
      主管(可在課程的「通知主管」清單中被選取,不需要是管理員身分)
    </label>
  `;
}
function toggleStaffPasswordField(){
  const role = document.getElementById('staffFormRole').value;
  document.getElementById('staffFormPasswordWrap').style.display = (role==='admin')? '' : 'none';
}
function showAddStaffForm(){
  const wrap = document.getElementById('addStaffFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      ${staffFormHtml(null)}
      <div class="form-row">
        <button class="btn accent" onclick="submitNewStaff(this)">儲存</button>
        <button class="btn ghost" onclick="document.getElementById('addStaffFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
  document.getElementById('staffFormRole').onchange = toggleStaffPasswordField;
}
function showEditStaffForm(id){
  const s = STATE.staff.find(x=>x.id===id);
  if(!s) return;
  const wrap = document.getElementById('addStaffFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">編輯人員</div>
      ${staffFormHtml(s)}
      <div class="form-row">
        <button class="btn accent" onclick="submitEditStaff(this,'${id}')">儲存變更</button>
        <button class="btn ghost" onclick="document.getElementById('addStaffFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
  document.getElementById('staffFormRole').onchange = toggleStaffPasswordField;
  wrap.scrollIntoView({behavior:'smooth'});
}
function readStaffForm(){
  const name = document.getElementById('staffFormName').value.trim();
  const dept = document.getElementById('staffFormDept').value.trim();
  const email = document.getElementById('staffFormEmail').value.trim();
  const role = document.getElementById('staffFormRole').value;
  const password = document.getElementById('staffFormPassword')? document.getElementById('staffFormPassword').value : '';
  const canViewRoster = document.getElementById('staffFormCanViewRoster').checked;
  const isManager = document.getElementById('staffFormIsManager').checked;
  return {name, dept, email, role, password, canViewRoster, isManager};
}
async function submitNewStaff(btn){
  const f = readStaffForm();
  if(!f.name){ alert('請輸入姓名'); return; }
  if(!f.email){ if(!confirm('未填寫Email的話,任何人都能不驗證身分就切換成這個人,確定要不填嗎?')) return; }
  if(f.role==='admin' && !f.password){ alert('請為這位管理員設定專屬密碼'); return; }
  const restore = lockBtn(btn, '儲存中...');
  let latest;
  try{ latest = await loadStaff(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  const newStaff = {id:uid(), name:f.name, dept:f.dept, email:f.email, role:f.role, canViewRoster:f.canViewRoster, isManager:f.isManager};
  if(f.role==='admin') newStaff.password = f.password;
  latest.push(newStaff);
  STATE.staff = latest;
  await saveStaff(STATE.staff);
  document.getElementById('addStaffFormWrap').innerHTML='';
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}
async function submitEditStaff(btn, id){
  const f = readStaffForm();
  if(!f.name){ alert('請輸入姓名'); return; }
  const restore = lockBtn(btn, '儲存中...');
  let latest;
  try{ latest = await loadStaff(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  const s = latest.find(x=>x.id===id);
  if(!s){ alert('找不到這位人員,可能已被其他人刪除,請重新整理頁面。'); restore(); return; }
  s.name = f.name; s.dept = f.dept; s.email = f.email; s.role = f.role; s.canViewRoster = f.canViewRoster; s.isManager = f.isManager;
  if(f.role==='admin'){
    if(f.password) s.password = f.password;
    else if(!s.password){ alert('請為這位管理員設定專屬密碼'); restore(); return; }
  } else {
    delete s.password;
  }
  STATE.staff = latest;
  await saveStaff(STATE.staff);
  document.getElementById('addStaffFormWrap').innerHTML='';
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}


async function deleteStaff(btn, id){
  if(STATE.staff.length<=1){ alert('至少需保留一位人員'); return; }
  if(!confirm('確定刪除此人員?學習紀錄將一併移除。')) return;
  const restore = lockBtn(btn, '刪除中...');
  let latest;
  try{ latest = await loadStaff(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  STATE.staff = latest.filter(s=>s.id!==id);
  delete STATE.progress[id];
  await saveStaff(STATE.staff);
  try{ await saveStaffProgress(id, {}); }catch(e){ console.error('清除學習紀錄失敗', e); }
  if(STATE.currentUserId===id){ STATE.currentUserId = STATE.staff[0].id; await saveCurrentUser(STATE.currentUserId); }
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}

/* ---------- Reports ---------- */
function renderReports(){
  return `
  <div class="topbar"><h1>學習報表</h1></div>
  <div class="card" style="margin-bottom:20px;">
    <div class="section-title" style="margin-top:0;">各人員詳細狀況</div>
    <table>
      <thead><tr><th>姓名</th><th>部門/職稱</th><th>完成率</th><th>觀看時數</th><th>測驗平均分數</th></tr></thead>
      <tbody>
        ${sortedStaff().map(s=>{
          const myCourses = coursesForStaff(s);
          const total = myCourses.length;
          let done=0, watchSec=0;
          const scores=[];
          myCourses.forEach(c=>{
            const p = userProgress(s.id)[c.id];
            if(isCourseComplete(s.id, c.id)) done++;
            if(p) watchSec += (p.watchSeconds||0);
            if(p && typeof p.quizScore==='number') scores.push(p.quizScore);
          });
          const pct = total? Math.round(done/total*100):0;
          const mins = Math.floor(watchSec/60), secs = Math.floor(watchSec%60);
          const avgScore = scores.length? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
          return `<tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.dept||'-')}</td>
            <td><span class="pill ${pct>=100?'ok':(pct>0?'warn':'off')}">${pct}%</span></td>
            <td>${mins} 分 ${secs} 秒</td>
            <td>${avgScore===null? '<span class="muted">尚未測驗</span>' : avgScore+'分'}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="5" class="empty">尚無人員資料</td></tr>'}
      </tbody>
    </table>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0;">各課程觀看時數(全體累計)</div>
    ${STATE.courses.filter(isPublished).map(c=>{
      let totalSec=0;
      STATE.staff.forEach(s=>{ const p=userProgress(s.id)[c.id]; if(p) totalSec += (p.watchSeconds||0); });
      const mins = Math.round(totalSec/60);
      const maxMin = 60;
      const pct = Math.min(100, Math.round(mins/maxMin*100));
      return `<div class="bar-row"><div class="name">${escapeHtml(c.title)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${mins}分</div></div>`;
    }).join('') || '<div class="empty">尚無課程資料</div>'}
  </div>
  `;
}

/* ---------- After render hooks ---------- */
function afterRender(){
  if(STATE.view==='courses'){
    setupPlayer();
  } else {
    stopWatch(false);
  }
}

initApp();
</script>
