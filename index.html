<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欣莘醫美集團內部教育訓練</title>
<style>
  :root{
    --sidebar:#4a423d;
    --sidebar-active:#5a5049;
    --bg:#f3ede6;
    --card:#fffdfb;
    --accent:#b98d7c;
    --accent-soft:#ede1da;
    --text:#3d3733;
    --sub:#948a80;
    --border:#e6ddd2;
    --ok:#8b9a83;
    --warn:#c6a26a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  /* Sidebar */
  .sidebar{width:230px;background:var(--sidebar);color:#e3dcd4;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .brand .name{font-weight:800;font-size:16px;color:#fff;letter-spacing:0.5px;}
  .brand .sub{font-size:10px;letter-spacing:2px;color:#a89b8f;}
  .nav-label{font-size:11px;color:#8f8177;padding:14px 10px 6px;letter-spacing:1px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#d8cfc5;margin-bottom:2px;}
  .nav-item:hover{background:#5a5049;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item .ico{width:18px;text-align:center;}
  .user-box{margin-top:auto;padding:12px;border-top:1px solid #5a5049;}
  .user-box select{width:100%;background:#5a5049;color:#fff;border:1px solid #6b6058;border-radius:8px;padding:8px;font-size:13px;}
  .user-box label{font-size:11px;color:#a89b8f;display:block;margin-bottom:6px;}

  /* Main */
  .main{flex:1;padding:28px 34px;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .topbar h1{font-size:26px;margin:0;}
  .topbar .date{font-size:12px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;}
  .btn{background:var(--sidebar);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{background:#213631;}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:#a67a67;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:6px 10px;font-size:12px;}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-card .label{color:var(--sub);font-size:13px;}
  .stat-card .value{font-size:30px;font-weight:800;margin-top:8px;}
  .stat-card .icon{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;}

  .section-title{font-size:16px;font-weight:700;margin:26px 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--sub);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;}
  td{padding:12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:#e6ebe2;color:var(--ok);}
  .pill.warn{background:#f5ecdd;color:var(--warn);}
  .pill.off{background:#efe9e2;color:var(--sub);}

  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  input[type=text],input[type=number],input[type=email],textarea,select.field{
    padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;flex:1;min-width:140px;
  }
  textarea{width:100%;min-height:60px;}
  .quiz-q{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfaf7;}
  .quiz-q .opt-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .course-list{display:flex;flex-direction:column;gap:10px;}
  .course-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;}
  .course-item:hover{border-color:var(--accent);}
  .course-item.selected{border-color:var(--accent);background:var(--accent-soft);}
  .course-item h4{margin:0 0 4px;font-size:14px;}
  .course-item p{margin:0;font-size:12px;color:var(--sub);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .name{width:100px;font-size:12px;color:var(--sub);flex-shrink:0;}
  .bar-track{flex:1;height:10px;background:#efece3;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
  .bar-row .pct{width:40px;text-align:right;font-size:12px;font-weight:700;}
  .empty{color:var(--sub);font-size:13px;padding:20px;text-align:center;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  .muted{color:var(--sub);font-size:12px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:13px;}
  .icon-btn:hover{color:var(--accent);}
  .result-banner{padding:14px;border-radius:10px;margin-bottom:14px;font-size:14px;font-weight:700;}
  .result-banner.pass{background:#e6ebe2;color:var(--ok);}
  .result-banner.fail{background:#f3e4de;color:#b06a54;}
  @media(max-width:900px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;}
    .grid4{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
  }
  .login-gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:50;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:320px;text-align:center;box-shadow:0 12px 32px rgba(60,50,40,0.10);}
  .login-logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .login-card h2{margin:0 0 2px;font-size:18px;}
  .login-label{display:block;text-align:left;font-size:12px;color:var(--sub);margin-bottom:6px;margin-top:14px;}
  .login-error{color:#b06a54;font-size:12px;text-align:left;margin-top:10px;}
</style>
</head>
<body>
<div id="loginGate" class="login-gate"></div>
<div class="app" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="logo">欣</div>
      <div>
        <div class="name">欣莘醫美集團</div>
        <div class="sub">INTERNAL TRAINING</div>
      </div>
    </div>
    <div class="nav-label">工作空間</div>
    <div class="nav-item active" data-view="dashboard" data-admin-only="1"><span class="ico">◆</span>營運總覽</div>
    <div class="nav-item" data-view="courses"><span class="ico">▣</span>課程與影片</div>
    <div class="nav-item" data-view="quiz"><span class="ico">✓</span>測驗中心</div>
    <div class="nav-item" data-view="staff" data-admin-only="1"><span class="ico">◎</span>人員管理</div>
    <div class="nav-item" data-view="reports" data-admin-only="1"><span class="ico">↗</span>學習報表</div>
    <div class="user-box">
      <label>目前身分</label>
      <div id="currentUserDisplay" style="color:#fff;font-weight:600;margin-bottom:10px;font-size:14px;"></div>
      <button class="btn ghost small" style="width:100%;" onclick="showLoginGate()">切換身分</button>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>

/* ---------- Storage helpers ---------- */
function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v!==null? JSON.parse(v): fallback; }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('儲存失敗', e); }
}

/* Shared backend: Google Apps Script + Google Sheet (JSONP — sidesteps Apps Script's inconsistent CORS headers) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzECIWlnmrXBzrZUNwLVyxF7geQMGJK-QddoeWCzd5WtEDMdixD3sKhKKKYT2owa5LJcQ/exec';
let __jsonpCounter = 0;
function jsonpRequest(params){
  return new Promise((resolve, reject)=>{
    const cbName = 'lms_cb_' + (__jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(timeout); delete window[cbName]; script.remove(); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script.src = API_URL + '?' + qs;
    script.onerror = ()=>{ cleanup(); reject(new Error('script load error')); };
    document.body.appendChild(script);
  });
}
async function apiGet(key){
  const val = await jsonpRequest({ key: key });
  return val; // null is a legitimate "key not found" result
}
async function apiSet(key, value){
  await jsonpRequest({ action:'set', key: key, value: JSON.stringify(value) });
}

async function loadStaff(){ const v = await apiGet('lms-staff'); return v===null? [] : v; }
async function saveStaff(list){ await apiSet('lms-staff', list); }
async function loadCourses(){ const v = await apiGet('lms-courses'); return v===null? [] : v; }
async function saveCourses(list){ await apiSet('lms-courses', list); }
async function loadProgress(){ const v = await apiGet('lms-progress'); return v===null? {} : v; }
async function saveProgress(obj){ await apiSet('lms-progress', obj); }
async function loadCurrentUser(){ return storageGet('lms-current-user', null); }
async function saveCurrentUser(id){ storageSet('lms-current-user', id); }
async function loadAdminPassword(){ const v = await apiGet('lms-admin-password'); return v===null? 'admin123' : v; }
async function saveAdminPassword(pw){ await apiSet('lms-admin-password', pw); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayLabel(){
  const d=new Date();
  const days=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  return days[d.getDay()]+' · '+d.getDate().toString().padStart(2,'0')+' '+d.toLocaleString('en-US',{month:'short'}).toUpperCase()+' '+d.getFullYear();
}
function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m? m[1]: (url.length===11? url:null);
}

/* ---------- App state ---------- */
let STATE = { view:'dashboard', staff:[], courses:[], progress:{}, currentUserId:null, selectedCourseId:null, quizAnswers:{}, quizResult:null, player:null, adminPassword:'admin123', adminAuthed:false };

async function initApp(){
  showLoadingGate();
  try{
    STATE.staff = await loadStaff();
    STATE.courses = await loadCourses();
    STATE.progress = await loadProgress();
    STATE.adminPassword = await loadAdminPassword();
  }catch(e){
    console.error('資料載入失敗', e);
    showLoadErrorGate();
    return;
  }
  const lastUserId = await loadCurrentUser();
  if(STATE.staff.length===0){
    STATE.staff = [
      {id:uid(), name:'管理員', dept:'教育訓練管理員', email:'', role:'admin'},
    ];
    await saveStaff(STATE.staff);
  }
  STATE.currentUserId = (lastUserId && STATE.staff.find(s=>s.id===lastUserId))? lastUserId : STATE.staff[0].id;
  if(STATE.courses.length>0) STATE.selectedCourseId = STATE.courses[0].id;
  showLoginGate();
}

function showLoadingGate(){
  const gate = document.getElementById('loginGate');
  gate.style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
  gate.innerHTML = `<div class="login-card"><div class="login-logo">欣</div><h2>載入中</h2><div class="muted">正在連線資料庫,請稍候...</div></div>`;
}

function showLoadErrorGate(){
  const gate = document.getElementById('loginGate');
  gate.style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
  gate.innerHTML = `
    <div class="login-card">
      <div class="login-logo">欣</div>
      <h2>連線失敗</h2>
      <div class="muted">無法連線到資料庫,可能是網路不穩定或Google服務暫時延遲。請確認網路連線後重新整理頁面,您的資料不會受影響。</div>
      <button class="btn accent" style="width:100%;margin-top:16px;" onclick="location.reload()">重新整理</button>
    </div>
  `;
}

function isAdmin(){
  const hasAnyAdmin = STATE.staff.some(s=>s.role==='admin');
  if(!hasAnyAdmin) return true; // fail-safe: never lock everyone out if no admin is set
  const u = currentUser();
  if(!u || u.role!=='admin') return false;
  return !!STATE.adminAuthed;
}

function updateNavVisibility(){
  const admin = isAdmin();
  document.querySelectorAll('.nav-item[data-admin-only]').forEach(el=>{
    el.style.display = admin ? '' : 'none';
  });
  if(!admin && ['dashboard','staff','reports'].includes(STATE.view)){
    STATE.view = 'courses';
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view==='courses'));
  }
}

function bindNav(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      el.classList.add('active');
      STATE.view = el.dataset.view;
      STATE.quizResult = null;
      STATE.quizAnswers = {};
      render();
    });
  });
}

/* ---------- Login gate ---------- */
function showLoginGate(){
  document.getElementById('loginGate').style.display = 'flex';
  document.querySelector('.app').style.display = 'none';
  renderLoginGateContent();
}
function hideLoginGate(){
  document.getElementById('loginGate').style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
}

function renderLoginGateContent(){
  const gate = document.getElementById('loginGate');
  gate.innerHTML = `
    <div class="login-card">
      <div class="login-logo">欣</div>
      <h2>欣莘醫美集團</h2>
      <div class="muted">內部教育訓練系統</div>
      <label class="login-label">請選擇登入身份</label>
      <select id="loginUserSelect" class="field" style="width:100%;">
        ${STATE.staff.map(s=>`<option value="${s.id}" ${s.id===STATE.currentUserId?'selected':''}>${escapeHtml(s.name)}${s.role==='admin'?'(管理員)':''}</option>`).join('')}
      </select>
      <div id="loginEmailWrap"></div>
      <div id="loginPasswordWrap"></div>
      <div id="loginError" class="login-error" style="display:none;"></div>
      <button class="btn accent" style="width:100%;margin-top:16px;" onclick="attemptLogin()">登入</button>
    </div>
  `;
  document.getElementById('loginUserSelect').onchange = updateLoginFieldsVisibility;
  updateLoginFieldsVisibility();
}

function updateLoginFieldsVisibility(){
  const sel = document.getElementById('loginUserSelect');
  const staffObj = STATE.staff.find(s=>s.id===sel.value);
  const emailWrap = document.getElementById('loginEmailWrap');
  const pwWrap = document.getElementById('loginPasswordWrap');
  emailWrap.innerHTML = (staffObj && staffObj.email)
    ? `<label class="login-label">請輸入您的Email以驗證身分</label><input type="email" id="loginEmailInput" class="field" style="width:100%;" placeholder="您的Email">`
    : '';
  const hasAnyAdmin = STATE.staff.some(s=>s.role==='admin');
  pwWrap.innerHTML = (hasAnyAdmin && staffObj && staffObj.role==='admin')
    ? `<label class="login-label">請輸入管理員密碼</label><input type="password" id="loginPasswordInput" class="field" style="width:100%;" placeholder="管理員密碼">`
    : '';
  document.getElementById('loginError').style.display = 'none';
}

async function attemptLogin(){
  const sel = document.getElementById('loginUserSelect');
  const staffObj = STATE.staff.find(s=>s.id===sel.value);
  const errEl = document.getElementById('loginError');
  if(!staffObj) return;
  if(staffObj.email){
    const emailInput = document.getElementById('loginEmailInput');
    const val = emailInput? emailInput.value.trim().toLowerCase() : '';
    if(val !== staffObj.email.trim().toLowerCase()){
      errEl.textContent = 'Email不正確,請重新輸入。';
      errEl.style.display = '';
      return;
    }
  }
  const hasAnyAdmin = STATE.staff.some(s=>s.role==='admin');
  if(hasAnyAdmin && staffObj.role==='admin'){
    const pwInput = document.getElementById('loginPasswordInput');
    const pwVal = pwInput? pwInput.value : '';
    if(pwVal !== STATE.adminPassword){
      errEl.textContent = '管理員密碼不正確。';
      errEl.style.display = '';
      return;
    }
  }
  STATE.currentUserId = staffObj.id;
  await saveCurrentUser(STATE.currentUserId);
  STATE.adminAuthed = (staffObj.role==='admin');
  STATE.quizResult = null;
  STATE.quizAnswers = {};
  if(!isAdmin() && ['dashboard','staff','reports'].includes(STATE.view)) STATE.view = 'courses';
  hideLoginGate();
  bindNav();
  renderCurrentUserDisplay();
  updateNavVisibility();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===STATE.view));
  render();
}

function renderCurrentUserDisplay(){
  const el = document.getElementById('currentUserDisplay');
  const u = currentUser();
  if(el) el.textContent = u? (u.name + (u.role==='admin'?'(管理員)':'')) : '';
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function currentUser(){ return STATE.staff.find(s=>s.id===STATE.currentUserId) || STATE.staff[0]; }
function userProgress(staffId){ return STATE.progress[staffId] || {}; }
function coursesForStaff(staffObj){
  if(!staffObj) return STATE.courses;
  return STATE.courses.filter(c=> !c.targetDepts || c.targetDepts.length===0 || c.targetDepts.includes(staffObj.dept));
}

function courseCompletionPct(staffId, courseId){
  const p = userProgress(staffId)[courseId];
  if(!p) return 0;
  let pct = 0;
  if(p.watched) pct += 50;
  if(p.quizPassed) pct += 50;
  return pct;
}

/* ---------- Render router ---------- */
function render(){
  if(!isAdmin() && ['dashboard','staff','reports'].includes(STATE.view)) STATE.view = 'courses';
  const main = document.getElementById('main');
  if(STATE.view==='dashboard') main.innerHTML = renderDashboard();
  else if(STATE.view==='courses') main.innerHTML = renderCourses();
  else if(STATE.view==='quiz') main.innerHTML = renderQuiz();
  else if(STATE.view==='staff') main.innerHTML = renderStaff();
  else if(STATE.view==='reports') main.innerHTML = renderReports();
  afterRender();
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const totalStaff = STATE.staff.length;
  const totalCourses = STATE.courses.length;
  let totalAssignments=0, totalCompleted=0, pendingQuiz=0;
  STATE.staff.forEach(s=>{
    coursesForStaff(s).forEach(c=>{
      totalAssignments++;
      const p = userProgress(s.id)[c.id];
      if(p && p.watched && p.quizPassed) totalCompleted++;
      if(p && p.watched && !p.quizPassed) pendingQuiz++;
    });
  });
  const rate = totalAssignments? Math.round(totalCompleted/totalAssignments*100):0;
  const u = currentUser();
  const myCourses = coursesForStaff(u);

  return `
  <div class="topbar">
    <div>
      <div class="date">${todayLabel()}</div>
      <h1>早安,${escapeHtml(u? u.name:'')}</h1>
      <div class="muted">這裡是教育訓練的整體概況。共 ${totalCourses} 門課程,${pendingQuiz} 項測驗待完成。</div>
    </div>
    <button class="btn accent" onclick="goView('courses')">+ 前往課程</button>
  </div>
  <div class="grid4">
    <div class="card stat-card"><div class="top"><div class="label">人員總數</div><div class="icon">◎</div></div><div class="value">${totalStaff}</div></div>
    <div class="card stat-card"><div class="top"><div class="label">課程總數</div><div class="icon">▣</div></div><div class="value">${totalCourses}</div></div>
    <div class="card stat-card"><div class="top"><div class="label">整體完成率</div><div class="icon">↗</div></div><div class="value">${rate}%</div></div>
    <div class="card stat-card"><div class="top"><div class="label">待完成測驗</div><div class="icon">!</div></div><div class="value">${pendingQuiz}</div></div>
  </div>

  <div class="section-title">我的課程進度</div>
  <div class="card">
    ${myCourses.length===0? '<div class="empty">目前沒有指派給您的課程。</div>' :
      myCourses.map(c=>{
        const pct = courseCompletionPct(u.id, c.id);
        return `<div class="bar-row"><div class="name">${escapeHtml(c.title)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`;
      }).join('')}
  </div>
  `;
}

function goView(v){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  STATE.view=v; render();
}

/* ---------- Courses ---------- */
function renderCourses(){
  const admin = isAdmin();
  const visibleCourses = admin? STATE.courses : coursesForStaff(currentUser());

function readCourseForm(){
  const title = document.getElementById('courseFormTitle').value.trim();
  const video = document.getElementById('courseFormVideo').value.trim();
  const desc = document.getElementById('courseFormDesc').value.trim();
  const targetDepts = Array.from(document.querySelectorAll('.deptCheck:checked')).map(el=>el.value);
  const qRows = document.querySelectorAll('#qBuilder .quiz-q');
  const quiz = [];
  qRows.forEach(row=>{
    const qtext = row.querySelector('.qtext').value.trim();
    const opts = Array.from(row.querySelectorAll('.qopt')).map(o=>o.value.trim());
    const answer = parseInt(row.querySelector('.qanswer').value,10);
    if(qtext && opts.every(o=>o)) quiz.push({q:qtext, options:opts, answer});
  });
  const matRows = document.querySelectorAll('#materialBuilder .form-row');
  const materials = [];
  matRows.forEach(row=>{
    const name = row.querySelector('.matname').value.trim();
    const url = row.querySelector('.materialUrl').value.trim();
    if(url) materials.push({name: name || '講義', url});
  });
  return {title, video, desc, quiz, materials, targetDepts};
}

function lockBtn(btn, loadingLabel){
  if(!btn) return ()=>{};
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = loadingLabel;
  return ()=>{ btn.disabled=false; btn.textContent=original; };
}

async function submitNewCourse(btn){
  const f = readCourseForm();
  if(!f.title || !ytId(f.video)){ alert('請填寫課程名稱與有效的 YouTube 連結'); return; }
  const restore = lockBtn(btn, '儲存中...');
  const course = {id:uid(), title:f.title, desc:f.desc, videoUrl:f.video, quiz:f.quiz, materials:f.materials, targetDepts:f.targetDepts};
  let latest;
  try{ latest = await loadCourses(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  latest.push(course);
  STATE.courses = latest;
  await saveCourses(STATE.courses);
  STATE.selectedCourseId = course.id;
  document.getElementById('addCourseFormWrap').innerHTML='';
  render();
}

/* YouTube player + watch time tracking */
let ytReadyQueue = [];
function onYouTubeIframeAPIReady(){
  window.__ytApiReady = true;
  ytReadyQueue.forEach(fn=>fn());
  ytReadyQueue = [];
}
let watchTimer = null;
function setupPlayer(){
  const el = document.getElementById('ytplayer');
  if(!el) return;
  const selected = STATE.courses.find(c=>c.id===STATE.selectedCourseId);
  if(!selected) return;
  const vid = ytId(selected.videoUrl);
  const start = ()=>{
    STATE.player = new YT.Player('ytplayer', {
      videoId: vid,
      playerVars: {rel:0},
      events:{
        onStateChange: onPlayerStateChange
      }
    });
  };
  if(window.__ytApiReady) start(); else ytReadyQueue.push(start);
}
async function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){
    clearInterval(watchTimer);
    watchTimer = setInterval(async ()=>{
      await addWatchSeconds(10);
    }, 10000);
  } else {
    clearInterval(watchTimer);
    if(e.data === YT.PlayerState.ENDED){
      await addWatchSeconds(0, true);
    }
  }
}
async function addWatchSeconds(sec, forceWatched){
  const u = currentUser();
  const cid = STATE.selectedCourseId;
  if(!u || !cid) return;
  let latest;
  try{ latest = await loadProgress(); }
  catch(e){ console.error('進度同步失敗,將於下次儲存時補上', e); return; }
  if(!latest[u.id]) latest[u.id] = {};
  if(!latest[u.id][cid]) latest[u.id][cid] = {watchSeconds:0, watched:false, quizPassed:false};
  latest[u.id][cid].watchSeconds = (latest[u.id][cid].watchSeconds||0) + sec;
  if(latest[u.id][cid].watchSeconds >= 20 || forceWatched) latest[u.id][cid].watched = true;
  STATE.progress = latest;
  await saveProgress(STATE.progress);
  const label = document.querySelector('.two-col .muted');
  if(label) render();
}

          const p = userProgress(u.id)[c.id];
          return `<div class="course-item ${selected&&c.id===selected.id?'selected':''}" onclick="selectQuizCourse('${c.id}')">

          </div>`;
        }).join('') || '<div class="empty">尚無測驗</div>'}
      </div>
    </div>
  </div>
  `;
}
function selectQuizCourse(id){ STATE.selectedCourseId=id; STATE.quizAnswers={}; STATE.quizResult=null; render(); }

function renderQuizBody(course, u){
  if(STATE.quizResult && STATE.quizResult.courseId===course.id){
    const r = STATE.quizResult;
    return `
    <div class="card">
      <div class="result-banner ${r.passed?'pass':'fail'}">${r.passed? '✓ 測驗通過':'✗ 未達通過標準'} — 得分 ${r.score}%(答對 ${r.correct}/${r.total} 題)</div>
      <button class="btn ghost small" onclick="STATE.quizResult=null;render();">重新測驗</button>
    </div>`;
  }
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <h3 style="margin-top:0;">${escapeHtml(course.title)} — 測驗</h3>
      ${isAdmin()? `<button class="btn ghost small" onclick="goToCourseEdit('${course.id}')">編輯此測驗</button>` : ''}
    </div>
    ${course.quiz.map((q,i)=>`
      <div class="quiz-q">
        <div style="font-weight:600;margin-bottom:6px;">${i+1}. ${escapeHtml(q.q)}</div>
        ${q.options.map((opt,oi)=>`
          <div class="opt-row">
            <input type="radio" name="q${i}" value="${oi}" onchange="STATE.quizAnswers[${i}]=${oi}">
            <label>${escapeHtml(opt)}</label>
          </div>
        `).join('')}
      </div>
    `).join('')}
    <button class="btn accent" onclick="submitQuiz(this,'${course.id}')">送出答案</button>
  </div>
  `;
}

async function submitQuiz(btn, courseId){
  const course = STATE.courses.find(c=>c.id===courseId);
  const u = currentUser();
  let correct = 0;
  course.quiz.forEach((q,i)=>{ if(STATE.quizAnswers[i]===q.answer) correct++; });
  const total = course.quiz.length;
  const score = Math.round(correct/total*100);
  const passed = score >= 70;
  const restore = lockBtn(btn, '送出中...');
  let latest;
  try{ latest = await loadProgress(); }catch(e){ alert('無法連線到資料庫,測驗結果尚未儲存,請確認網路連線後重新送出。'); restore(); return; }
  if(!latest[u.id]) latest[u.id] = {};
  if(!latest[u.id][courseId]) latest[u.id][courseId] = {watchSeconds:0, watched:false, quizPassed:false};
  latest[u.id][courseId].quizScore = score;
  latest[u.id][courseId].quizPassed = passed;
  STATE.progress = latest;
  await saveProgress(STATE.progress);
  STATE.quizResult = {courseId, correct, total, score, passed};
  render();
}

  const f = readStaffForm();
  if(!f.name){ alert('請輸入姓名'); return; }
  if(!f.email){ if(!confirm('未填寫Email的話,任何人都能不驗證身分就切換成這個人,確定要不填嗎?')) return; }
  const restore = lockBtn(btn, '儲存中...');
  let latest;
  try{ latest = await loadStaff(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  latest.push({id:uid(), name:f.name, dept:f.dept, email:f.email, role:f.role});
  STATE.staff = latest;
  await saveStaff(STATE.staff);
  document.getElementById('addStaffFormWrap').innerHTML='';
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}
async function submitEditStaff(btn, id){
  const f = readStaffForm();
  if(!f.name){ alert('請輸入姓名'); return; }
  const restore = lockBtn(btn, '儲存中...');
  let latest;
  try{ latest = await loadStaff(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  const s = latest.find(x=>x.id===id);
  if(!s){ alert('找不到這位人員,可能已被其他人刪除,請重新整理頁面。'); restore(); return; }
  s.name = f.name; s.dept = f.dept; s.email = f.email; s.role = f.role;
  STATE.staff = latest;
  await saveStaff(STATE.staff);
  document.getElementById('addStaffFormWrap').innerHTML='';
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}
async function changeAdminPassword(){
  const current = prompt('請輸入目前的管理員密碼:');
  if(current === null) return;
  if(current !== STATE.adminPassword){ alert('目前密碼不正確'); return; }
  const next = prompt('請輸入新密碼:');
  if(!next) return;
  const confirmPw = prompt('請再輸入一次新密碼確認:');
  if(next !== confirmPw){ alert('兩次輸入的新密碼不一致,請重新操作。'); return; }
  STATE.adminPassword = next;
  await saveAdminPassword(next);
  alert('管理員密碼已更新。');
}

async function deleteStaff(btn, id){
  if(STATE.staff.length<=1){ alert('至少需保留一位人員'); return; }
  if(!confirm('確定刪除此人員?學習紀錄將一併移除。')) return;
  const restore = lockBtn(btn, '刪除中...');
  let latest, latestProgress;
  try{ latest = await loadStaff(); latestProgress = await loadProgress(); }catch(e){ alert('無法連線到資料庫,請確認網路連線後再試一次。'); restore(); return; }
  STATE.staff = latest.filter(s=>s.id!==id);
  delete latestProgress[id];
  STATE.progress = latestProgress;
  await saveStaff(STATE.staff);
  await saveProgress(STATE.progress);
  if(STATE.currentUserId===id){ STATE.currentUserId = STATE.staff[0].id; await saveCurrentUser(STATE.currentUserId); }
  renderCurrentUserDisplay();
  updateNavVisibility();
  render();
}

/* ---------- Reports ---------- */
function renderReports(){
  return `
  <div class="topbar"><h1>學習報表</h1></div>
  <div class="two-col">
    <div class="card">
      <div class="section-title" style="margin-top:0;">各人員完成率</div>
      ${STATE.staff.map(s=>{
        const myCourses = coursesForStaff(s);
        const total = myCourses.length;
        let done=0;
        myCourses.forEach(c=>{ const p=userProgress(s.id)[c.id]; if(p&&p.watched&&p.quizPassed) done++; });
        const pct = total? Math.round(done/total*100):0;
        return `<div class="bar-row"><div class="name">${escapeHtml(s.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`;
      }).join('') || '<div class="empty">尚無人員資料</div>'}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">各課程觀看時數(全體累計)</div>
      ${STATE.courses.map(c=>{
        let totalSec=0;
        STATE.staff.forEach(s=>{ const p=userProgress(s.id)[c.id]; if(p) totalSec += (p.watchSeconds||0); });
        const mins = Math.round(totalSec/60);
        const maxMin = 60;
        const pct = Math.min(100, Math.round(mins/maxMin*100));
        return `<div class="bar-row"><div class="name">${escapeHtml(c.title)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${mins}分</div></div>`;
      }).join('') || '<div class="empty">尚無課程資料</div>'}
    </div>
  </div>
  `;
}

/* ---------- After render hooks ---------- */
function afterRender(){
  if(STATE.view==='courses'){
    setupPlayer();
  } else {
    clearInterval(watchTimer);
  }
}

initApp();
</script>
