<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欣莘醫美集團內部教育訓練</title>
<style>
  :root{
    --sidebar:#16241f;
    --sidebar-active:#213631;
    --bg:#f6f4ee;
    --card:#ffffff;
    --accent:#ff6a3d;
    --accent-soft:#ffe4d8;
    --text:#1c211f;
    --sub:#767f7b;
    --border:#e7e3da;
    --ok:#2fae7e;
    --warn:#e0a52c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  /* Sidebar */
  .sidebar{width:230px;background:var(--sidebar);color:#cfe0d8;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .brand .name{font-weight:800;font-size:16px;color:#fff;letter-spacing:0.5px;}
  .brand .sub{font-size:10px;letter-spacing:2px;color:#7e9188;}
  .nav-label{font-size:11px;color:#657b71;padding:14px 10px 6px;letter-spacing:1px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#c9d8d1;margin-bottom:2px;}
  .nav-item:hover{background:#1c2e28;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item .ico{width:18px;text-align:center;}
  .user-box{margin-top:auto;padding:12px;border-top:1px solid #223832;}
  .user-box select{width:100%;background:#1c2e28;color:#fff;border:1px solid #2c443c;border-radius:8px;padding:8px;font-size:13px;}
  .user-box label{font-size:11px;color:#7e9188;display:block;margin-bottom:6px;}

  /* Main */
  .main{flex:1;padding:28px 34px;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .topbar h1{font-size:26px;margin:0;}
  .topbar .date{font-size:12px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;}
  .btn{background:var(--sidebar);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{background:#213631;}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:#e85a2c;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:6px 10px;font-size:12px;}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-card .label{color:var(--sub);font-size:13px;}
  .stat-card .value{font-size:30px;font-weight:800;margin-top:8px;}
  .stat-card .icon{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;}

  .section-title{font-size:16px;font-weight:700;margin:26px 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--sub);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;}
  td{padding:12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:#e2f6ec;color:var(--ok);}
  .pill.warn{background:#fdf1dc;color:var(--warn);}
  .pill.off{background:#f0efe9;color:var(--sub);}

  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  input[type=text],input[type=number],input[type=email],textarea,select.field{
    padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;flex:1;min-width:140px;
  }
  textarea{width:100%;min-height:60px;}
  .quiz-q{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfaf7;}
  .quiz-q .opt-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .course-list{display:flex;flex-direction:column;gap:10px;}
  .course-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;}
  .course-item:hover{border-color:var(--accent);}
  .course-item.selected{border-color:var(--accent);background:var(--accent-soft);}
  .course-item h4{margin:0 0 4px;font-size:14px;}
  .course-item p{margin:0;font-size:12px;color:var(--sub);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .name{width:100px;font-size:12px;color:var(--sub);flex-shrink:0;}
  .bar-track{flex:1;height:10px;background:#efece3;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
  .bar-row .pct{width:40px;text-align:right;font-size:12px;font-weight:700;}
  .empty{color:var(--sub);font-size:13px;padding:20px;text-align:center;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  .muted{color:var(--sub);font-size:12px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:13px;}
  .icon-btn:hover{color:var(--accent);}
  .result-banner{padding:14px;border-radius:10px;margin-bottom:14px;font-size:14px;font-weight:700;}
  .result-banner.pass{background:#e2f6ec;color:var(--ok);}
  .result-banner.fail{background:#fdeeee;color:#d9534f;}
  @media(max-width:900px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;}
    .grid4{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="logo">欣</div>
      <div>
        <div class="name">欣莘醫美集團</div>
        <div class="sub">INTERNAL TRAINING</div>
      </div>
    </div>
    <div class="nav-label">工作空間</div>
    <div class="nav-item active" data-view="dashboard"><span class="ico">◆</span>營運總覽</div>
    <div class="nav-item" data-view="courses"><span class="ico">▣</span>課程與影片</div>
    <div class="nav-item" data-view="quiz"><span class="ico">✓</span>測驗中心</div>
    <div class="nav-item" data-view="staff"><span class="ico">◎</span>人員管理</div>
    <div class="nav-item" data-view="reports"><span class="ico">↗</span>學習報表</div>
    <div class="user-box">
      <label>目前身分</label>
      <select id="currentUserSelect"></select>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ---------- Storage helpers ---------- */
function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v!==null? JSON.parse(v): fallback; }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('儲存失敗', e); }
}

/* Shared backend: Google Apps Script + Google Sheet (JSONP — sidesteps Apps Script's inconsistent CORS headers) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzECIWlnmrXBzrZUNwLVyxF7geQMGJK-QddoeWCzd5WtEDMdixD3sKhKKKYT2owa5LJcQ/exec';
let __jsonpCounter = 0;
function jsonpRequest(params){
  return new Promise((resolve, reject)=>{
    const cbName = 'lms_cb_' + (__jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(timeout); delete window[cbName]; script.remove(); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script.src = API_URL + '?' + qs;
    script.onerror = ()=>{ cleanup(); reject(new Error('script load error')); };
    document.body.appendChild(script);
  });
}
async function apiGet(key, fallback){
  try{
    const val = await jsonpRequest({ key: key });
    return (val===null || val===undefined) ? fallback : val;
  }catch(e){ console.error('讀取資料庫失敗', e); return fallback; }
}
async function apiSet(key, value){
  try{
    await jsonpRequest({ action:'set', key: key, value: JSON.stringify(value) });
  }catch(e){ console.error('寫入資料庫失敗', e); }
}

async function loadStaff(){ return apiGet('lms-staff', []); }
async function saveStaff(list){ await apiSet('lms-staff', list); }
async function loadCourses(){ return apiGet('lms-courses', []); }
async function saveCourses(list){ await apiSet('lms-courses', list); }
async function loadProgress(){ return apiGet('lms-progress', {}); }
async function saveProgress(obj){ await apiSet('lms-progress', obj); }
async function loadCurrentUser(){ return storageGet('lms-current-user', null); }
async function saveCurrentUser(id){ storageSet('lms-current-user', id); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayLabel(){
  const d=new Date();
  const days=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  return days[d.getDay()]+' · '+d.getDate().toString().padStart(2,'0')+' '+d.toLocaleString('en-US',{month:'short'}).toUpperCase()+' '+d.getFullYear();
}
function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m? m[1]: (url.length===11? url:null);
}

/* ---------- App state ---------- */
let STATE = { view:'dashboard', staff:[], courses:[], progress:{}, currentUserId:null, selectedCourseId:null, quizAnswers:{}, quizResult:null, player:null };

async function initApp(){
  document.getElementById('main').innerHTML = '<div class="empty" style="padding:80px 0;">資料載入中,請稍候...</div>';
  STATE.staff = await loadStaff();
  STATE.courses = await loadCourses();
  STATE.progress = await loadProgress();
  STATE.currentUserId = await loadCurrentUser();
  if(STATE.staff.length===0){
    STATE.staff = [
      {id:uid(), name:'管理員', dept:'教育訓練管理員', email:''},
    ];
    await saveStaff(STATE.staff);
  }
  if(!STATE.currentUserId || !STATE.staff.find(s=>s.id===STATE.currentUserId)){
    STATE.currentUserId = STATE.staff[0].id;
    await saveCurrentUser(STATE.currentUserId);
  }
  if(STATE.courses.length>0) STATE.selectedCourseId = STATE.courses[0].id;
  bindNav();
  renderUserSelect();
  render();
}

function bindNav(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      el.classList.add('active');
      STATE.view = el.dataset.view;
      STATE.quizResult = null;
      STATE.quizAnswers = {};
      render();
    });
  });
}

function renderUserSelect(){
  const sel = document.getElementById('currentUserSelect');
  sel.innerHTML = STATE.staff.map(s=>`<option value="${s.id}" ${s.id===STATE.currentUserId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  sel.onchange = async ()=>{
    STATE.currentUserId = sel.value;
    await saveCurrentUser(STATE.currentUserId);
    render();
  };
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function currentUser(){ return STATE.staff.find(s=>s.id===STATE.currentUserId) || STATE.staff[0]; }
function userProgress(staffId){ return STATE.progress[staffId] || {}; }

function courseCompletionPct(staffId, courseId){
  const p = userProgress(staffId)[courseId];
  if(!p) return 0;
  let pct = 0;
  if(p.watched) pct += 50;
  if(p.quizPassed) pct += 50;
  return pct;
}

/* ---------- Render router ---------- */
function render(){
  const main = document.getElementById('main');
  if(STATE.view==='dashboard') main.innerHTML = renderDashboard();
  else if(STATE.view==='courses') main.innerHTML = renderCourses();
  else if(STATE.view==='quiz') main.innerHTML = renderQuiz();
  else if(STATE.view==='staff') main.innerHTML = renderStaff();
  else if(STATE.view==='reports') main.innerHTML = renderReports();
  afterRender();
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const totalStaff = STATE.staff.length;
  const totalCourses = STATE.courses.length;
  let totalAssignments=0, totalCompleted=0, pendingQuiz=0;
  STATE.staff.forEach(s=>{
    STATE.courses.forEach(c=>{
      totalAssignments++;
      const p = userProgress(s.id)[c.id];
      if(p && p.watched && p.quizPassed) totalCompleted++;
      if(p && p.watched && !p.quizPassed) pendingQuiz++;
    });
  });
  const rate = totalAssignments? Math.round(totalCompleted/totalAssignments*100):0;
  const u = currentUser();

  return `
  <div class="topbar">
    <div>
      <div class="date">${todayLabel()}</div>
      <h1>早安,${escapeHtml(u? u.name:'')}</h1>
      <div class="muted">這裡是教育訓練的整體概況。共 ${totalCourses} 門課程,${pendingQuiz} 項測驗待完成。</div>
    </div>
    <button class="btn accent" onclick="goView('courses')">+ 前往課程</button>
  </div>
  <div class="grid4">
    <div class="card stat-card"><div class="top"><div class="label">人員總數</div><div class="icon">◎</div></div><div class="value">${totalStaff}</div></div>
    <div class="card stat-card"><div class="top"><div class="label">課程總數</div><div class="icon">▣</div></div><div class="value">${totalCourses}</div></div>
    <div class="card stat-card"><div class="top"><div class="label">整體完成率</div><div class="icon">↗</div></div><div class="value">${rate}%</div></div>
    <div class="card stat-card"><div class="top"><div class="label">待完成測驗</div><div class="icon">!</div></div><div class="value">${pendingQuiz}</div></div>
  </div>

  <div class="section-title">我的課程進度</div>
  <div class="card">
    ${STATE.courses.length===0? '<div class="empty">尚未建立任何課程,前往「課程與影片」新增。</div>' :
      STATE.courses.map(c=>{
        const pct = courseCompletionPct(u.id, c.id);
        return `<div class="bar-row"><div class="name">${escapeHtml(c.title)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`;
      }).join('')}
  </div>
  `;
}

function goView(v){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  STATE.view=v; render();
}

/* ---------- Courses ---------- */
function renderCourses(){
  const selected = STATE.courses.find(c=>c.id===STATE.selectedCourseId) || STATE.courses[0];
  const u = currentUser();
  const prog = selected? userProgress(u.id)[selected.id] : null;

  return `
  <div class="topbar">
    <h1>課程與影片</h1>
    <button class="btn accent" onclick="showAddCourseForm()">+ 新增課程</button>
  </div>
  <div id="addCourseFormWrap"></div>
  <div class="two-col">
    <div>
      ${selected? `
        <div class="card">
          <div class="video-wrap"><div id="ytplayer"></div></div>
          <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="margin:0 0 6px;">${escapeHtml(selected.title)}</h3>
              <p class="muted" style="max-width:520px;">${escapeHtml(selected.desc||'')}</p>
            </div>
            <div>
              ${prog && prog.watched? '<span class="pill ok">已觀看</span>' : '<span class="pill off">尚未觀看</span>'}
              ${prog && prog.quizPassed? '<span class="pill ok">測驗通過</span>' : (selected.quiz&&selected.quiz.length? '<span class="pill warn">待測驗</span>':'')}
            </div>
          </div>
          <div class="muted" style="margin-top:10px;">累計觀看時間:${Math.floor((prog?.watchSeconds||0)/60)} 分 ${Math.floor((prog?.watchSeconds||0)%60)} 秒</div>
          ${selected.quiz && selected.quiz.length? `<button class="btn ghost small" style="margin-top:10px;" onclick="goToQuiz('${selected.id}')">前往測驗 →</button>`:''}
          <button class="icon-btn" style="margin-top:10px;float:right;" onclick="deleteCourse('${selected.id}')">刪除此課程</button>
        </div>
      ` : '<div class="card empty">尚未選擇課程,請先新增或於右側選擇。</div>'}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">課程清單</div>
      <div class="course-list">
        ${STATE.courses.map(c=>{
          const p = userProgress(u.id)[c.id];
          return `<div class="course-item ${c.id===STATE.selectedCourseId?'selected':''}" onclick="selectCourse('${c.id}')">
            <div><h4>${escapeHtml(c.title)}</h4><p>${p&&p.watched?'已觀看':'未觀看'} ${c.quiz&&c.quiz.length? '· '+c.quiz.length+' 題測驗':''}</p></div>
            <span class="pill ${p&&p.watched&&p.quizPassed?'ok':(p&&p.watched?'warn':'off')}">${p&&p.watched&&p.quizPassed?'完成':(p&&p.watched?'待測驗':'未開始')}</span>
          </div>`;
        }).join('') || '<div class="empty">尚無課程</div>'}
      </div>
    </div>
  </div>
  `;
}

function selectCourse(id){ STATE.selectedCourseId=id; render(); }

function showAddCourseForm(){
  const wrap = document.getElementById('addCourseFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">新增課程</div>
      <div class="form-row">
        <input type="text" id="newCourseTitle" placeholder="課程名稱">
        <input type="text" id="newCourseVideo" placeholder="YouTube 影片連結(建議設為不公開)">
      </div>
      <textarea id="newCourseDesc" placeholder="課程說明(選填)"></textarea>
      <div class="muted" style="margin:8px 0;">測驗題目(選填,可稍後於測驗中心編輯)</div>
      <div id="qBuilder"></div>
      <div class="form-row" style="margin-top:8px;">
        <button class="btn ghost small" onclick="addQuestionRow()">+ 新增題目</button>
      </div>
      <div class="form-row" style="margin-top:10px;">
        <button class="btn accent" onclick="submitNewCourse()">儲存課程</button>
        <button class="btn ghost" onclick="document.getElementById('addCourseFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
  addQuestionRow();
}

function addQuestionRow(){
  const b = document.getElementById('qBuilder');
  const idx = b.children.length;
  const row = document.createElement('div');
  row.className='quiz-q';
  row.innerHTML = `
    <input type="text" class="qtext" placeholder="題目 ${idx+1}">
    <div class="opt-row"><input type="text" class="qopt" placeholder="選項 A"></div>
    <div class="opt-row"><input type="text" class="qopt" placeholder="選項 B"></div>
    <div class="opt-row"><input type="text" class="qopt" placeholder="選項 C"></div>
    <div class="opt-row"><input type="text" class="qopt" placeholder="選項 D"></div>
    <div class="opt-row">
      <span class="muted">正確答案(0=A,1=B,2=C,3=D):</span>
      <input type="number" class="qanswer" min="0" max="3" value="0" style="width:60px;flex:none;">
    </div>
  `;
  b.appendChild(row);
}

async function submitNewCourse(){
  const title = document.getElementById('newCourseTitle').value.trim();
  const video = document.getElementById('newCourseVideo').value.trim();
  const desc = document.getElementById('newCourseDesc').value.trim();
  if(!title || !ytId(video)){ alert('請填寫課程名稱與有效的 YouTube 連結'); return; }
  const qRows = document.querySelectorAll('#qBuilder .quiz-q');
  const quiz = [];
  qRows.forEach(row=>{
    const qtext = row.querySelector('.qtext').value.trim();
    const opts = Array.from(row.querySelectorAll('.qopt')).map(o=>o.value.trim());
    const answer = parseInt(row.querySelector('.qanswer').value,10);
    if(qtext && opts.every(o=>o)) quiz.push({q:qtext, options:opts, answer});
  });
  const course = {id:uid(), title, desc, videoUrl:video, quiz};
  STATE.courses.push(course);
  await saveCourses(STATE.courses);
  STATE.selectedCourseId = course.id;
  document.getElementById('addCourseFormWrap').innerHTML='';
  render();
}

async function deleteCourse(id){
  if(!confirm('確定要刪除此課程?')) return;
  STATE.courses = STATE.courses.filter(c=>c.id!==id);
  await saveCourses(STATE.courses);
  STATE.selectedCourseId = STATE.courses[0]?.id || null;
  render();
}

/* YouTube player + watch time tracking */
let ytReadyQueue = [];
function onYouTubeIframeAPIReady(){
  window.__ytApiReady = true;
  ytReadyQueue.forEach(fn=>fn());
  ytReadyQueue = [];
}
let watchTimer = null;
function setupPlayer(){
  const el = document.getElementById('ytplayer');
  if(!el) return;
  const selected = STATE.courses.find(c=>c.id===STATE.selectedCourseId);
  if(!selected) return;
  const vid = ytId(selected.videoUrl);
  const start = ()=>{
    STATE.player = new YT.Player('ytplayer', {
      videoId: vid,
      playerVars: {rel:0},
      events:{
        onStateChange: onPlayerStateChange
      }
    });
  };
  if(window.__ytApiReady) start(); else ytReadyQueue.push(start);
}
async function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){
    clearInterval(watchTimer);
    watchTimer = setInterval(async ()=>{
      await addWatchSeconds(2);
    }, 2000);
  } else {
    clearInterval(watchTimer);
    if(e.data === YT.PlayerState.ENDED){
      await markWatched();
    }
  }
}
async function addWatchSeconds(sec){
  const u = currentUser();
  const cid = STATE.selectedCourseId;
  if(!u || !cid) return;
  if(!STATE.progress[u.id]) STATE.progress[u.id] = {};
  if(!STATE.progress[u.id][cid]) STATE.progress[u.id][cid] = {watchSeconds:0, watched:false, quizPassed:false};
  STATE.progress[u.id][cid].watchSeconds = (STATE.progress[u.id][cid].watchSeconds||0) + sec;
  const course = STATE.courses.find(c=>c.id===cid);
  if(course && STATE.progress[u.id][cid].watchSeconds >= 20) STATE.progress[u.id][cid].watched = true;
  await saveProgress(STATE.progress);
  const label = document.querySelector('.two-col .muted');
  if(label) render();
}
async function markWatched(){
  const u = currentUser();
  const cid = STATE.selectedCourseId;
  if(!u || !cid) return;
  if(!STATE.progress[u.id]) STATE.progress[u.id] = {};
  if(!STATE.progress[u.id][cid]) STATE.progress[u.id][cid] = {watchSeconds:0, watched:false, quizPassed:false};
  STATE.progress[u.id][cid].watched = true;
  await saveProgress(STATE.progress);
  render();
}

function goToQuiz(courseId){
  STATE.selectedCourseId = courseId;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view==='quiz'));
  STATE.view='quiz';
  STATE.quizAnswers={};
  STATE.quizResult=null;
  render();
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  const u = currentUser();
  const withQuiz = STATE.courses.filter(c=>c.quiz && c.quiz.length);
  const selected = withQuiz.find(c=>c.id===STATE.selectedCourseId) || withQuiz[0];

  return `
  <div class="topbar"><h1>測驗中心</h1></div>
  <div class="two-col">
    <div>
      ${selected? renderQuizBody(selected, u) : '<div class="card empty">目前沒有附測驗的課程。可於「課程與影片」新增課程時加入測驗題目。</div>'}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">選擇測驗課程</div>
      <div class="course-list">
        ${withQuiz.map(c=>{
          const p = userProgress(u.id)[c.id];
          return `<div class="course-item ${selected&&c.id===selected.id?'selected':''}" onclick="selectQuizCourse('${c.id}')">
            <div><h4>${escapeHtml(c.title)}</h4><p>${c.quiz.length} 題</p></div>
            <span class="pill ${p&&p.quizPassed?'ok':'off'}">${p&&p.quizPassed?'已通過 '+p.quizScore+'%':'未測驗'}</span>
          </div>`;
        }).join('') || '<div class="empty">尚無測驗</div>'}
      </div>
    </div>
  </div>
  `;
}
function selectQuizCourse(id){ STATE.selectedCourseId=id; STATE.quizAnswers={}; STATE.quizResult=null; render(); }

function renderQuizBody(course, u){
  if(STATE.quizResult && STATE.quizResult.courseId===course.id){
    const r = STATE.quizResult;
    return `
    <div class="card">
      <div class="result-banner ${r.passed?'pass':'fail'}">${r.passed? '✓ 測驗通過':'✗ 未達通過標準'} — 得分 ${r.score}%(答對 ${r.correct}/${r.total} 題)</div>
      <button class="btn ghost small" onclick="STATE.quizResult=null;render();">重新測驗</button>
    </div>`;
  }
  return `
  <div class="card">
    <h3 style="margin-top:0;">${escapeHtml(course.title)} — 測驗</h3>
    ${course.quiz.map((q,i)=>`
      <div class="quiz-q">
        <div style="font-weight:600;margin-bottom:6px;">${i+1}. ${escapeHtml(q.q)}</div>
        ${q.options.map((opt,oi)=>`
          <div class="opt-row">
            <input type="radio" name="q${i}" value="${oi}" onchange="STATE.quizAnswers[${i}]=${oi}">
            <label>${escapeHtml(opt)}</label>
          </div>
        `).join('')}
      </div>
    `).join('')}
    <button class="btn accent" onclick="submitQuiz('${course.id}')">送出答案</button>
  </div>
  `;
}

async function submitQuiz(courseId){
  const course = STATE.courses.find(c=>c.id===courseId);
  const u = currentUser();
  let correct = 0;
  course.quiz.forEach((q,i)=>{ if(STATE.quizAnswers[i]===q.answer) correct++; });
  const total = course.quiz.length;
  const score = Math.round(correct/total*100);
  const passed = score >= 70;
  if(!STATE.progress[u.id]) STATE.progress[u.id] = {};
  if(!STATE.progress[u.id][courseId]) STATE.progress[u.id][courseId] = {watchSeconds:0, watched:false, quizPassed:false};
  STATE.progress[u.id][courseId].quizScore = score;
  STATE.progress[u.id][courseId].quizPassed = passed;
  await saveProgress(STATE.progress);
  STATE.quizResult = {courseId, correct, total, score, passed};
  render();
}

/* ---------- Staff ---------- */
function renderStaff(){
  return `
  <div class="topbar">
    <h1>人員管理</h1>
    <button class="btn accent" onclick="showAddStaffForm()">+ 新增人員</button>
  </div>
  <div id="addStaffFormWrap"></div>
  <div class="card">
    <table>
      <thead><tr><th>姓名</th><th>部門/職稱</th><th>Email</th><th>整體完成率</th><th></th></tr></thead>
      <tbody>
        ${STATE.staff.map(s=>{
          const total = STATE.courses.length;
          let done=0;
          STATE.courses.forEach(c=>{ const p=userProgress(s.id)[c.id]; if(p&&p.watched&&p.quizPassed) done++; });
          const pct = total? Math.round(done/total*100):0;
          return `<tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.dept||'-')}</td>
            <td>${escapeHtml(s.email||'-')}</td>
            <td><span class="pill ${pct>=100?'ok':(pct>0?'warn':'off')}">${pct}%</span></td>
            <td><button class="icon-btn" onclick="deleteStaff('${s.id}')">刪除</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}
function showAddStaffForm(){
  const wrap = document.getElementById('addStaffFormWrap');
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="form-row">
        <input type="text" id="newStaffName" placeholder="姓名">
        <input type="text" id="newStaffDept" placeholder="部門/職稱">
        <input type="email" id="newStaffEmail" placeholder="Email(選填)">
      </div>
      <div class="form-row">
        <button class="btn accent" onclick="submitNewStaff()">儲存</button>
        <button class="btn ghost" onclick="document.getElementById('addStaffFormWrap').innerHTML=''">取消</button>
      </div>
    </div>
  `;
}
async function submitNewStaff(){
  const name = document.getElementById('newStaffName').value.trim();
  const dept = document.getElementById('newStaffDept').value.trim();
  const email = document.getElementById('newStaffEmail').value.trim();
  if(!name){ alert('請輸入姓名'); return; }
  STATE.staff.push({id:uid(), name, dept, email});
  await saveStaff(STATE.staff);
  document.getElementById('addStaffFormWrap').innerHTML='';
  renderUserSelect();
  render();
}
async function deleteStaff(id){
  if(STATE.staff.length<=1){ alert('至少需保留一位人員'); return; }
  if(!confirm('確定刪除此人員?學習紀錄將一併移除。')) return;
  STATE.staff = STATE.staff.filter(s=>s.id!==id);
  delete STATE.progress[id];
  await saveStaff(STATE.staff);
  await saveProgress(STATE.progress);
  if(STATE.currentUserId===id){ STATE.currentUserId = STATE.staff[0].id; await saveCurrentUser(STATE.currentUserId); }
  renderUserSelect();
  render();
}

/* ---------- Reports ---------- */
function renderReports(){
  return `
  <div class="topbar"><h1>學習報表</h1></div>
  <div class="two-col">
    <div class="card">
      <div class="section-title" style="margin-top:0;">各人員完成率</div>
      ${STATE.staff.map(s=>{
        const total = STATE.courses.length;
        let done=0;
        STATE.courses.forEach(c=>{ const p=userProgress(s.id)[c.id]; if(p&&p.watched&&p.quizPassed) done++; });
        const pct = total? Math.round(done/total*100):0;
        return `<div class="bar-row"><div class="name">${escapeHtml(s.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`;
      }).join('') || '<div class="empty">尚無人員資料</div>'}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">各課程觀看時數(全體累計)</div>
      ${STATE.courses.map(c=>{
        let totalSec=0;
        STATE.staff.forEach(s=>{ const p=userProgress(s.id)[c.id]; if(p) totalSec += (p.watchSeconds||0); });
        const mins = Math.round(totalSec/60);
        const maxMin = 60;
        const pct = Math.min(100, Math.round(mins/maxMin*100));
        return `<div class="bar-row"><div class="name">${escapeHtml(c.title)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${mins}分</div></div>`;
      }).join('') || '<div class="empty">尚無課程資料</div>'}
    </div>
  </div>
  `;
}

/* ---------- After render hooks ---------- */
function afterRender(){
  if(STATE.view==='courses'){
    setupPlayer();
  } else {
    clearInterval(watchTimer);
  }
}

initApp();
</script>
</body>
</html>
